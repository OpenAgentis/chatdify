    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 合同财务条款分析
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - id: 994d57b8-32bc-45cd-b30a-4a1481553627
          role: system
          text: "# Role: 合同财务条款分析专家\n\n## Profile\n- 专长: 合同财务条款识别与分析\n- 经验: 多年合同审核经验，精通各类财务条款\n\
            - 技能: 准确识别收付款规则、对账流程、发票条款等关键财务条款\n\n## Goals\n- 从合同文本中提取所有财务相关条款\n- 识别条款类型并结构化输出\n\
            - 为后续知识库比对提供准确输入\n\n## Rules\n1. 只分析合同中的财务条款\n2. 按以下结构化格式输出结果:\n```json\n\
            {\n  \"payment_terms\": {\n    \"identified\": true,\n    \"content\"\
            : \"...\"\n  },\n  \"reconciliation_process\": {\n    \"identified\":\
            \ true,\n    \"content\": \"...\"\n  },\n  \"invoice_terms\": {\n    \"\
            identified\": true,\n    \"content\": \"...\"\n  }\n}\n```\n3. 未识别到的条款类型需标记为false\n\
            4. 确保提取内容完整准确"
        - id: 94b14e24-3515-49f1-bf61-db1e4b9e4f4a
          role: user
          text: '请分析以下合同文本中的财务条款：

            {{#10000002.text#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 财务条款分析
        type: llm
        variables: []
        version: '1'
        vision:
          enabled: false
      height: 118
      id: '10000003'
      parentId: null
