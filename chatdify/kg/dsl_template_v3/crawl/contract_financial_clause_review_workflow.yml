    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 合同财务条款对比分析
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - id: 994d57b8-32bc-45cd-b30a-4a1481553627
          role: system
          text: "# Role: 合同财务条款对比分析专家\n\n## Profile\n- 专长: 合同财务条款合规性分析\n- 经验: 多年合同审核经验，精通各类财务条款合规性要求\n\
            - 技能: 准确识别条款冲突点并提供专业建议\n\n## Goals\n- 对比合同条款与知识库规则\n- 识别所有重大冲突点\n- 生成结构化审核意见\n\
            \n## Rules\n1. 严格遵循知识库中的审核规则\n2. 对每类财务条款进行逐项对比\n3. 重大冲突点必须明确标注\n4. 输出结构化对比结果\n\
            \n## Output Format\n```json\n{\n  \"payment_terms\": {\n    \"compliance\"\
            : true/false,\n    \"conflicts\": [\"冲突点描述\"],\n    \"suggestion\": \"\
            改进建议\"\n  },\n  \"reconciliation_process\": {\n    \"compliance\": true/false,\n\
            \    \"conflicts\": [\"冲突点描述\"],\n    \"suggestion\": \"改进建议\"\n  },\n\
            \  \"invoice_terms\": {\n    \"compliance\": true/false,\n    \"conflicts\"\
            : [\"冲突点描述\"],\n    \"suggestion\": \"改进建议\"\n  }\n}\n```"
        - id: 94b14e24-3515-49f1-bf61-db1e4b9e4f4a
          role: user
          text: '请对比分析以下合同财务条款与审核规则：


            合同条款：

            {{#10000003.text#}}


            审核规则：

            {{#10000004.result#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 条款对比分析
        type: llm
        variables: []
        version: '1'
        vision:
          enabled: false
      height: 118
      id: '10000005'
      parentId: null
