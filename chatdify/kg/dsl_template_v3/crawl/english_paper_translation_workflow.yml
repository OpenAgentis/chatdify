    - data:
        code: "def main(text: str) -> dict:\n    \"\"\"\n    将长文本分割为适合翻译的段落，每个段落约500-1000字\n\
          \    保持句子和段落语义的完整性\n    \"\"\"\n    \n    # 分割参数\n    min_chunk_size = 5000\
          \  # 最小段落字数\n    max_chunk_size = 10000  # 最大段落字数\n    \n    paragraphs\
          \ = []\n    current_chunk = \"\"\n    \n    # 按句子分割文本（简单实现，可根据需要改进）\n  \
          \  sentences = []\n    temp_sentence = \"\"\n    \n    # 初步分割句子（按句号、问号、感叹号分割）\n\
          \    for char in text:\n        temp_sentence += char\n        if char in\
          \ ['.', '?', '!']:\n            sentences.append(temp_sentence.strip())\n\
          \            temp_sentence = \"\"\n    \n    # 处理剩余的文本\n    if temp_sentence:\n\
          \        sentences.append(temp_sentence.strip())\n    \n    # 构建段落\n   \
          \ for sentence in sentences:\n        # 如果当前段落加上新句子不超过最大长度，则添加\n       \
          \ if len(current_chunk) + len(sentence) <= max_chunk_size:\n           \
          \ current_chunk += \" \" + sentence if current_chunk else sentence\n   \
          \     else:\n            # 如果当前段落已达到最小长度，则作为一个段落\n            if len(current_chunk)\
          \ >= min_chunk_size:\n                paragraphs.append(current_chunk)\n\
          \                current_chunk = sentence\n            else:\n         \
          \       # 否则继续添加直到达到最小长度\n                current_chunk += \" \" + sentence\n\
          \    \n    # 添加最后一个段落\n    if current_chunk:\n        paragraphs.append(current_chunk)\n\
          \    \n    # 确保至少有一个段落\n    if not paragraphs:\n        paragraphs.append(text)\n\
          \    \n    return {\"paragraphs\": paragraphs}"
        code_language: python3
        desc: 将长文本分割为适合翻译的段落，保持语义完整性
