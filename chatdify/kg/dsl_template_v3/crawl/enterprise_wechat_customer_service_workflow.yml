    - data:
        code: "import json\n\ndef main(http_response: dict) -> dict:\n    \"\"\"\n\
          \    解析核验状态数据\n    \n    参数:\n        http_response: HTTP请求返回的原始数据\n   \
          \     \n    返回:\n        格式化后的核验状态信息\n    \"\"\"\n    \n    def extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n        \"\"\"从markdown提取JSON内容\"\"\"\n        start = markdown_text.find('```json')\n\
          \        if start == -1:\n            start = markdown_text.find('```')\n\
          \            if start == -1:\n                return markdown_text.strip()\n\
          \        \n        start = markdown_text.find('\\n', start) + 1\n      \
          \  end = markdown_text.rfind('```')\n        return markdown_text[start:end].strip()\n\
          \    \n    try:\n        # 获取HTTP响应体\n        response_body = http_response.get('body',\
          \ '')\n        \n        # 处理可能的markdown包裹的JSON\n        json_text = extract_json_from_markdown(response_body)\n\
          \        \n        # 解析JSON\n        data = json.loads(json_text)\n    \
          \    \n        # 提取关键字段\n        company_name = data.get('company_name',\
          \ '')\n        verification_status = data.get('status', '')\n        progress\
          \ = data.get('progress', 0)\n        last_update = data.get('last_update',\
          \ '')\n        \n        # 格式化输出\n        result = {\n            'company_name':\
          \ company_name,\n            'verification_status': verification_status,\n\
          \            'progress': f\"{progress}%\",\n            'last_update': last_update,\n\
          \            'summary': f\"企业'{company_name}'的核验状态为：{verification_status}，当前进度{progress}%，最后更新时间：{last_update}\"\
          \n        }\n        \n        return {\n            'status': 'success',\n\
          \            'message': '',\n            'data': result\n        }\n   \
          \     \n    except Exception as e:\n        return {\n            'status':\
          \ 'error',\n            'message': f\"解析核验状态数据失败: {str(e)}\",\n        \
          \    'data': None\n        }"
        code_language: python3
        desc: 解析核验状态数据，提取关键字段并格式化
