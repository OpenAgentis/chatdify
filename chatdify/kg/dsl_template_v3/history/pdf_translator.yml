    - data:
        code: "import re\n\ndef main(pdf_text: str) -> dict:\n    \"\"\"\n    将PDF文本按章节分割成数组\n\
          \    \n    参数:\n        pdf_text: 从PDF提取的完整文本内容\n        \n    返回:\n   \
          \     包含章节数组的字典，格式为 {'chapters': List[str]}\n    \"\"\"\n    \n    # 使用正则表达式按章节标题分割文本\n\
          \    # 假设章节标题格式为 'Chapter X' 或 'CHAPTER X'\n    chapter_pattern = re.compile(r'(?i)(Chapter|CHAPTER)\\\
          s+\\d+\\s*\\n')\n    \n    # 分割文本\n    chapters = chapter_pattern.split(pdf_text)\n\
          \    \n    # 过滤空章节并去除前后空白\n    chapters = [chap.strip() for chap in chapters\
          \ if chap.strip()]\n    \n    return {\n        \"chapters\": chapters\n\
          \    }"
        code_language: python3
        desc: 将PDF文本内容按章节分割成数组
        outputs:
          chapters:
            children: null
            type: array[string]
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 章节分割
