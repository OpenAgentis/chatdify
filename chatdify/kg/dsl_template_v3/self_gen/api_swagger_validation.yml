        is_array_file: false
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: Swagger文档提取器
        type: document-extractor
        variable_selector:
        - '10000001'
        - swagger_file
        version: '1'
      height: 119
      id: '10000002'
      parentId: null
      position:
        x: 400
        y: 100
      positionAbsolute:
        x: 400
        y: 100
      type: custom
      width: 244
      zIndex: 0
    - data:
        code: "import json\nimport yaml\n\ndef main(swagger_text: str) -> dict:\n\
          \    \"\"\"\n    解析Swagger文档并提取API信息\n    \n    参数:\n        swagger_text:\
          \ Swagger文档的原始文本内容\n        \n    返回:\n        包含API端点、参数、响应等信息的结构化数据\n\
          \    \"\"\"\n    \n    def extract_json_from_markdown(markdown_text: str)\
          \ -> str:\n        \"\"\"从markdown提取JSON内容\"\"\"\n        start = markdown_text.find('```json')\n\
          \        if start == -1:\n            start = markdown_text.find('```')\n\
          \            if start == -1:\n                return markdown_text.strip()\n\
          \        \n        start = markdown_text.find('\\n', start) + 1\n      \
          \  end = markdown_text.rfind('```')\n        return markdown_text[start:end].strip()\n\
          \    \n    try:\n        # 预处理输入，去除可能的markdown标记\n        clean_text = extract_json_from_markdown(swagger_text)\n\
          \        \n        # 尝试解析为JSON或YAML\n        try:\n            if clean_text.strip().startswith('{'):\n\
          \                swagger_data = json.loads(clean_text)\n            else:\n\
          \                swagger_data = yaml.safe_load(clean_text)\n        except\
          \ Exception as e:\n            return {\n                \"error\": f\"\
          解析Swagger文档失败: {str(e)}\",\n                \"apis\": []\n            }\n\
          \        \n        # 提取API信息\n        apis = []\n        \n        # 处理Swagger\
          \ 2.0或OpenAPI 3.0格式\n        if 'swagger' in swagger_data or 'openapi' in\
          \ swagger_data:\n            paths = swagger_data.get('paths', {})\n   \
          \         \n            for path, methods in paths.items():\n          \
          \      for method, details in methods.items():\n                    if method.lower()\
          \ in ['get', 'post', 'put', 'delete', 'patch']:\n                      \
          \  api_info = {\n                            \"path\": path,\n         \
          \                   \"method\": method.upper(),\n                      \
          \      \"summary\": details.get('summary', ''),\n                      \
          \      \"description\": details.get('description', ''),\n              \
          \              \"parameters\": details.get('parameters', []),\n        \
          \                    \"responses\": details.get('responses', {})\n     \
          \                   }\n                        apis.append(api_info)\n \
          \       \n        return {\n            \"apis\": apis,\n            \"\
          error\": None\n        }\n        \n    except Exception as e:\n       \
          \ return {\n            \"error\": f\"处理Swagger文档时发生错误: {str(e)}\",\n  \
          \          \"apis\": []\n        }"
        code_language: python3
        desc: 解析Swagger文档并提取API信息
        outputs:
          apis:
            children: null
            type: array[object]
          error:
            children: null
            type: string
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: true
