    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 评估API质量并生成评分
        model:
          completion_params: {}
          mode: chat
          name: deepseek-v3
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - role: system
          text: '你是一位专业的API质量评估专家。请根据提供的API规范，从以下维度进行全面评估并给出评分（满分100分）：

            1. 接口设计合理性（20分）

            2. 参数定义完整性（20分）

            3. 响应结构规范性（20分）

            4. 错误处理机制（20分）

            5. 文档描述清晰度（20分）


            请以表格形式输出评估结果，包含评分项、得分和简要评价。最后给出总分。'
        - role: user
          text: '请评估以下API规范的质量：

            {{#10000003.apis#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: API质量评估
        type: llm
        variables:
        - value_selector:
          - '10000003'
          - apis
          variable: apis
        version: '1'
        vision:
          enabled: false
      height: 117
      id: '10000004'
      parentId: null
      position:
        x: 1000
        y: 100
      positionAbsolute:
        x: 1000
        y: 100
      selected: false
      type: custom
      width: 244
      zIndex: 0
    - data:
        desc: 格式化API评估结果为表格形式
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        template: 'API质量评估结果


          | 评分项 | 得分 | 评价 |

          |--------|------|------|

          {% for item in evaluation_results %}| {{ item.criteria }} | {{ item.score
          }} | {{ item.comment }} |

          {% endfor %}


          **总分**: {{ total_score }}/100'
        title: 评估结果格式化
        type: template-transform
        variables:
        - value_selector:
          - '10000004'
          - text
          variable: evaluation_results
        - value_selector:
          - '10000004'
          - text
          variable: total_score
        version: '1'
