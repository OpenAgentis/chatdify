app:
  description: ''
  icon: ''
  icon_background: '#FFFFFF'
  mode: workflow
  name: brand_pr_assistant
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/siliconflow:0.0.8@217f973bd7ced1b099c2f0c669f1356bdf4cc38b8372fd58d7874f9940b95de3
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/volcengine_maas:0.0.24@d99937d2f1cef247df06e0341558416c768b31bd820af745d2db41d0a5c32a46
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: knowledge-retrieval
      id: 10000001-source-10000002-target
      source: '10000001'
      sourceHandle: source
      target: '10000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: 10000002-source-10000003-target
      source: '10000002'
      sourceHandle: source
      target: '10000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 接收用户输入的初始问题，作为整个工作流的起点
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: Start
        type: start
        variables:
        - label: 用户问题
          max_length: 99999
          required: true
          type: paragraph
          variable: input
        version: '1'
      height: 134
      id: '10000001'
      parentId: null
      position:
        x: 30
        y: 263
      positionAbsolute:
        x: 30
        y: 263
      type: custom
      width: 244
      zIndex: 0
    - data:
        dataset_ids:
        - 8c4620fa-15d7-464f-9cb9-561f1a59eb3f
        desc: 知识检索节点，用于从品牌传播资料知识库中检索与用户问题相关的内容
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: weighted_score
          reranking_model:
            model: BAAI/bge-reranker-v2-m3
            provider: langgenius/siliconflow/siliconflow
          score_threshold: null
          top_k: 6
          weights:
            keyword_setting:
              keyword_weight: 0.3
            vector_setting:
              embedding_model_name: BAAI/bge-m3
              embedding_provider_name: langgenius/siliconflow/siliconflow
              vector_weight: 0.7
        query_variable_selector:
        - '10000001'
        - input
        retrieval_mode: multiple
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: Knowledge Retrieval
        type: knowledge-retrieval
        version: '1'
      height: 98
      id: '10000002'
      parentId: null
      position:
        x: 315
        y: 250
      positionAbsolute:
        x: 315
        y: 250
      selected: false
      type: custom
      width: 244
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 大语言模型节点，扮演品牌公关经理角色，基于知识库内容回答用户问题
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一名专业的品牌公关经理，负责根据公司知识库的内容回答用户问题。请遵循以下规则：


            1. 严格基于知识库提供的信息进行回答，确保内容准确且专业

            2. 回答必须符合品牌调性，使用正式、专业的语言

            3. 如果知识库中没有相关信息，请明确回答"根据现有资料，我无法提供相关信息"

            4. 不得主观编造或推测任何信息

            5. 回答应结构清晰，逻辑严谨'
        - role: user
          text: '用户问题：{{#10000001.input#}}


            知识库检索结果：

            {{#10000002.result#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: Brand PR Manager
        type: llm
        version: '1'
        vision:
          enabled: false
      height: 134
      id: '10000003'
      parentId: null
      position:
        x: 626
        y: 242
      positionAbsolute:
        x: 626
        y: 242
      selected: true
      type: custom
      width: 244
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 1
