app:
  description: ''
  icon: ''
  icon_background: '#FFFFFF'
  mode: workflow
  name: code_translation_assistant
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/volcengine_maas:0.0.24@d99937d2f1cef247df06e0341558416c768b31bd820af745d2db41d0a5c32a46
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: 1-source-2-target
      source: '1'
      sourceHandle: source
      target: '2'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: 2-source-3-target
      source: '2'
      sourceHandle: source
      target: '3'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 接收用户输入的代码片段和目标语言
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: Start
        type: start
        variables:
        - label: 需要翻译的代码片段
          max_length: 33024
          required: true
          type: paragraph
          variable: code_to_translate
        - label: 目标编程语言
          options:
          - Python
          - Java
          - JavaScript
          - Go
          - C++
          - C#
          - Ruby
          - PHP
          - Swift
          - Kotlin
          required: true
          type: select
          variable: target_language
        version: '1'
      height: 144
      id: '1'
      parentId: null
      position:
        x: 30
        y: 30
      positionAbsolute:
        x: 30
        y: 30
      type: custom
      width: 244
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 将输入的代码片段翻译成目标语言
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - id: 2e5e4e13-2974-440b-9ee5-c015d9aae4ba
          role: system
          text: '你是一位专业的编程语言翻译专家，精通多种编程语言。你的任务是将给定的代码片段从原始语言准确地翻译成指定的目标语言，保持功能完整性和语法正确性。


            翻译要求：

            1. 确保翻译后的代码功能与原始代码完全一致

            2. 符合目标语言的语法规范和最佳实践

            3. 保留原始代码的结构和逻辑

            4. 处理必要的语言特性差异

            5. 输出完整的可执行代码'
        - id: 067b610f-6234-4f0d-bf20-9c7d86e7562d
          role: user
          text: '请将以下代码从原始语言翻译成{{#1.target_language#}}:


            ```

            {{#1.code_to_translate#}}

            ```'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: 代码翻译
        type: llm
        variables: []
        version: '1'
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 118
      id: '2'
      parentId: null
      position:
        x: 334
        y: 30
      positionAbsolute:
        x: 334
        y: 30
      type: custom
      width: 244
      zIndex: 0
    - data:
        desc: 输出翻译结果
        output_type: object
        outputs:
        - value_selector:
          - '2'
          - text
          variable: final_code
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: End
        type: end
        version: '1'
      height: 118
      id: '3'
      parentId: null
      position:
        x: 600
        y: 150
      positionAbsolute:
        x: 600
        y: 150
      type: custom
      width: 244
      zIndex: 0
    viewport:
      x: 240
      y: 218
      zoom: 1
