    - data:
        code: "def main(text: str) -> dict:\n    \"\"\"\n    根据段落标记拆分会议文本，保持段落完整性\n\
          \    \n    参数:\n        text: 完整的会议文本内容\n    \n    返回:\n        包含拆分后段落的字典，格式为\
          \ {'paragraphs': List[str]}\n    \"\"\"\n    # 按双换行符拆分段落，保留原始段落结构\n    paragraphs\
          \ = [p.strip() for p in text.split('\\n\\n') if p.strip()]\n    \n    #\
          \ 如果段落太少，尝试按单换行符拆分\n    if len(paragraphs) <= 1:\n        paragraphs = [p.strip()\
          \ for p in text.split('\\n') if p.strip()]\n    \n    return {\n       \
          \ \"paragraphs\": paragraphs\n    }"
        code_language: python3
        desc: 将会议文本按段落拆分，保持语义完整性
        outputs:
          paragraphs:
            children: null
            type: array[string]
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 段落拆分
        type: code
        variables:
