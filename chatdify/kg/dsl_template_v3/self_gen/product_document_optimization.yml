    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 将提取的文档内容转换为结构化的产品需求文档
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一位专业的产品经理，擅长将原始文档内容转化为结构清晰、要素完整的产品需求文档。请根据提供的文档内容，生成包含以下要素的高质量产品需求文档：

            1. 功能描述（清晰定义产品功能）

            2. 用户故事（从用户角度描述需求）

            3. 验收标准（可衡量的功能完成标准）

            4. 优先级评估

            5. 技术考虑要点


            输出格式要求：使用Markdown格式，确保层次结构清晰，内容完整专业。'
        - role: user
          text: '请根据以下文档内容生成产品需求文档：

            {{#10000002.text#}}


            要求：

            1. 保持原始文档的核心信息不变

            2. 补充必要的细节和上下文

            3. 使用专业的产品文档语言

            4. 确保所有需求要素完整'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 产品需求文档生成器
        type: llm
        variables: []
        version: '1'
        vision:
          enabled: false
      height: 134
      id: '10000003'
      parentId: null
      position:
        x: 570
        y: 30
      positionAbsolute:
        x: 570
        y: 30
      type: custom
      width: 244
      zIndex: 0
    - data:
        desc: 输出最终的产品需求文档
        output_type: object
        outputs:
        - value_selector:
          - '10000003'
          - text
          variable: product_requirements_document
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 产品需求文档输出
        type: end
        version: '1'
