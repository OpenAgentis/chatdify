app:
  description: ''
  icon: ''
  icon_background: '#FFFFFF'
  mode: workflow
  name: text_optimization_assistant
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/volcengine_maas:0.0.24@d99937d2f1cef247df06e0341558416c768b31bd820af745d2db41d0a5c32a46
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: 10000001-source-10000002-target
      source: '10000001'
      sourceHandle: source
      target: '10000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: 10000002-source-10000003-target
      source: '10000002'
      sourceHandle: source
      target: '10000003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 接收用户输入的文稿内容
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 开始
        type: start
        variables:
        - label: 文稿内容
          max_length: 99999
          required: true
          type: paragraph
          variable: content
        - label: 目标受众
          options:
          - 普通读者
          - 专业人士
          - 学生
          - 企业用户
          required: false
          type: select
          variable: target_audience
        - label: 写作风格
          options:
          - 正式
          - 轻松
          - 技术性
          - 新闻体
          - 创意写作
          required: false
          type: select
          variable: writing_style
        version: '1'
      height: 170
      id: '10000001'
      parentId: null
      position:
        x: 30
        y: 30
      positionAbsolute:
        x: 30
        y: 30
      type: custom
      width: 244
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: LLM节点用于检查文稿的语法、标点符号问题并进行优化
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一位专业的文稿优化专家，擅长检查语法错误、修正标点符号和优化句子结构。请根据用户提供的文稿内容进行以下处理：

            1. 检查并修正所有语法错误

            2. 规范标点符号使用

            3. 优化句子结构和表达方式

            4. 根据目标受众和写作风格要求调整文本


            请确保：

            - 保留原文核心内容

            - 所有修正符合语法规范

            - 优化后的文本符合目标受众的阅读习惯'
        - role: user
          text: '请优化以下文稿：

            文稿内容：{{#10000001.content#}}

            目标受众：{{#10000001.target_audience#}}

            写作风格：{{#10000001.writing_style#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 文稿优化
        type: llm
        variables: []
        version: '1'
        vision:
          enabled: false
      height: 134
      id: '10000002'
      parentId: null
      position:
        x: 318.3791736799525
        y: 21.95175497545955
      positionAbsolute:
        x: 318.3791736799525
        y: 21.95175497545955
      selected: true
      type: custom
      width: 244
      zIndex: 0
    - data:
        desc: 输出最终优化后的文稿内容
        output_type: object
        outputs:
        - value_selector:
          - '10000002'
          - text
          variable: optimized_content
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: 优化结果输出
        type: end
        version: '1'
      height: 118
      id: '10000003'
      parentId: null
      position:
        x: 617.2304753249556
        y: 56.539191855886486
      positionAbsolute:
        x: 617.2304753249556
        y: 56.539191855886486
      selected: false
      type: custom
      width: 244
      zIndex: 0
    viewport:
      x: 82.46249330019839
      y: 155.41729144707904
      zoom: 0.8705505632961241
