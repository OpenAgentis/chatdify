node_usage:
  - 节点类型: agent
  - 使用规范:
      - Agent 节点是 Dify Chatflow/Workflow 中用于实现自主工具调用的组件。 
      - 通过集成不同的 Agent 推理策略，使大语言模型能够在运行时动态选择并执行工具，从而实现多步推理。 
      - 支持 Function Calling 和 ReAct 两种内置策略，也可安装第三方 Agent 策略插件。 
      - 适用于需要外部知识或需要执行特定操作的场景，例如问答、信息检索、任务执行等。 
      - 提供记忆功能，可为 Agent 提供对话上下文记忆能力。
  - 输入规范:
      - 节点接受以下参数：
          - Agent 策略提供者名称（agent_strategy_provider_name）：指定 Agent 策略的提供者。
          - Agent 策略名称（agent_strategy_name）：指定使用的 Agent 推理策略。
          - Agent 策略标签（agent_strategy_label）：Agent 策略的显示标签。
          - Agent 参数（agent_parameters）：Agent 策略的配置参数，包括：
              - 参数值（value）：可以是字符串列表、工具选择器列表或其他任意值。
              - 参数类型（type）：支持 "mixed"、"variable"、"constant" 三种类型。
                  - mixed：混合类型，支持 Jinja2 模板语法引用变量。
                  - variable：变量类型，直接引用变量池中的变量。
                  - constant：常量类型，使用固定值。
      - 策略特定配置：
          - 模型：选择驱动 Agent 的大语言模型。
          - 工具：配置 Agent 可调用的工具列表。 
          - 指令：定义 Agent 的任务目标和上下文。 
          - 查询：接收用户输入。
          - 最大迭代次数：设定 Agent 的最大执行步数。
          - 输出变量：定义节点输出的数据结构。
  - 常见实用错误：
      - Agent 策略配置错误：
          - Agent 策略获取失败：确保 agent_strategy_provider_name 和 agent_strategy_name 配置正确。
          - Agent 策略不存在：检查指定的 Agent 策略是否已安装或可用。
          - 插件守护进程客户端错误：Agent 策略插件通信异常。
      - 参数配置错误：
          - 参数类型无效：确保参数类型为 "mixed"、"variable" 或 "constant"。
          - 变量引用错误：当参数类型为 "variable" 时，确保引用的变量存在于变量池中。
          - 模板解析失败：当参数类型为 "mixed" 时，确保 Jinja2 模板语法正确。
          - 工具选择器格式错误：检查工具选择器的配置格式是否正确。
      - 模型配置错误：
          - 模型不可用：确保选择的大语言模型已配置且可用。
          - 模型权限不足：检查模型的访问权限和配额限制。
          - 模型类型不匹配：确保选择的模型支持 Agent 功能。
      - 工具配置错误：
          - 工具授权失败：检查工具的 API 密钥等授权信息是否正确。
          - 工具参数配置错误：确保工具的功能参数配置正确。
          - 工具描述不清晰：提供清晰的工具描述，帮助 LLM 理解工具用途。
      - 运行时错误：
          - 变量池状态异常：Agent 运行过程中变量池状态不一致。
          - 工具调用失败：Agent 调用工具时出现错误。
          - 最大迭代次数超限：Agent 执行步数超过设定的最大值。
          - 内存不足：处理大量数据时可能出现内存不足问题。