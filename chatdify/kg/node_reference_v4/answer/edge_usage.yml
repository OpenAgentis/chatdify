edge_usage:
  节点类型: answer
  使用规范:
      - Answer 节点是 Dify Chatflow/Workflow 中的终端输出节点，用于定义工作流的最终回答内容。
      - 支持文本模板和变量插值，可以引用工作流中其他节点的输出变量。
      - 通过变量选择器语法 {{#node_id.variable_name#}} 来引用前置节点的输出。
      - 支持文件类型变量的输出，包括单个文件和文件数组。
      - 作为工作流的结束节点，将处理后的内容作为最终答案返回给用户。
      - 适用于需要格式化输出、组合多个节点结果的场景。
  应用场景:
    适用场景:
      - 流程结果输出展示：作为工作流的终端输出节点，展示最终处理结果
      - 中间步骤流式输出：在流程中间环节输出阶段性结果
      - 多媒体内容聚合展示：整合文本、图片、音频等多种类型内容
      - 状态提示信息输出：向用户显示处理状态和进度信息
      - 错误信息反馈：当流程出现异常时返回错误提示
      - 格式化内容呈现：将处理结果以特定格式（如Markdown）展示
      - 变量与文本组合输出：结合前置节点变量和自定义文本内容
      - 图文混排展示：支持所见即所得的多媒体内容配置
    不适用场景:
      - 需要复杂数据处理的场景：Answer节点仅用于内容展示，不进行数据处理
  常见使用错误: ""