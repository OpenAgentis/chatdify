node_usage:
  节点类型: answer
  输入规范:
      - 节点接受以下参数：
          - answer：必填字段，字符串类型，回答模板内容。
          - 支持纯文本内容和变量插值的混合模板。
          - 变量选择器格式：{{#node_id.variable_name#}}，其中 node_id 是前置节点的 ID，variable_name 是该节点输出的变量名。
          - 模板中可以包含多个变量引用和静态文本内容。
  常见使用错误:
      - 配置错误：
          - 回答内容不能为空：确保 answer 字段有有效内容。
          - 变量选择器格式错误：确保使用正确的 {{#node_id.variable_name#}} 格式。
          - 引用不存在的节点：确保变量选择器中的 node_id 对应实际存在的前置节点。
          - 引用不存在的变量：确保变量选择器中的 variable_name 是前置节点的有效输出变量。
      - 模板解析错误：
          - 变量选择器语法错误：检查大括号、井号的配对和位置。
          - 变量模板解析失败：确保模板语法符合 VariableTemplateParser 的要求。
          - 变量选择器验证过程发生错误：检查变量池中是否存在引用的变量。
      - 运行时错误：
          - 变量值为空或未定义：确保前置节点正常执行并产生了预期的输出变量。
          - 变量类型不匹配：注意文件类型变量和普通变量的处理差异。
          - 循环依赖：避免 Answer 节点之间形成循环引用关系。
      - 数据流错误：
          - 前置节点执行失败导致变量不可用。
          - 变量池状态异常，无法正确获取变量值。
          - 文件变量处理错误，无法正确提取文件内容或元数据。