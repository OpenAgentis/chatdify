edge_usage:
  节点类型: code
  使用规范:
      - Code节点用于执行Python代码，允许用户在工作流中编写自定义的数据处理逻辑。
      - 它可以接收上游节点的输出作为输入变量，执行Python代码后返回处理结果。
      - 支持复杂的数据处理、计算、格式转换等操作。
      - 代码必须包含一个main函数作为入口点，该函数接收输入变量并返回结果。
      - 支持正常返回分支和异常返回分支，用于处理不同的执行结果。
  应用场景:
    适用场景:
      - 常见使用场景包括：JSON解析转换、数学计算、数据拼接整合、格式转换、条件判断、API响应提取。
      - 在迭代循环中解析子任务步骤对象，提取步骤信息和历史执行上下文。
      - 根据用户选择的基准语言返回对应的文档内容。
      - 将子任务的处理结果进行结构化聚合。
      - 将分步生成的代码翻译结果合并成完整的最终代码。
      - 处理LLM生成的JSON数据，如春联内容、课程内容等。
      - 从输入的字典中提取特定字段并重新封装输出。
      - 调用外部API（如腾讯云VOD、图像生成API等）进行数据处理。
      - 处理HTTP请求的响应结果，解析JSON格式数据。
      - 将记忆内容与当前时间进行关联组织。
      - 从多种输入源中提取文本内容并标准化处理。
    不适用场景:
      - 不支持文件系统访问（沙箱化限制）。
  常见使用错误: ""