- data:
    code: "import json\nimport os\nimport re\n\ndef main(json_str: str) -> dict:\n\
      \    try:\n        # 预处理：清理非 JSON 部分\n        json_match = re.search(r'\\{.*\\\
      }', json_str, re.DOTALL)\n        if not json_match:\n            return {\"\
      result\": \"Error: Invalid JSON format\"}\n        \n        # 提取合法的 JSON 部分\n\
      \        cleaned_json_str = json_match.group(0)\n        \n        # 解析JSON数据\n\
      \        data = json.loads(cleaned_json_str)\n        filename = data.get(\"\
      filename\", \"stock_chart.html\")\n        stock_data = data.get(\"上证指数日线行情\"\
      , [])\n        \n        # 准备数据格式\n        dates = [item['date'].split(' ')[0]\
      \ for item in stock_data]  # 提取日期部分（去掉时间）\n        open_prices = [item['open']\
      \ for item in stock_data]\n        close_prices = [item['close'] for item in\
      \ stock_data]\n        low_prices = [item['low'] for item in stock_data]\n \
      \       high_prices = [item['high'] for item in stock_data]\n        volumes\
      \ = [item['volume'] / 1e8 for item in stock_data]  # 转换为亿单位\n        \n    \
      \    # 构建ECharts配置\n        echarts_config = {\n            \"title\": {\n \
      \               \"text\": \"上证指数日线行情\"\n            },\n            \"legend\"\
      : {\n                \"data\": [\"开盘价\", \"最高价\", \"最低价\", \"收盘价\", \"成交量\"\
      ]\n            },\n            \"tooltip\": {},\n            \"dataset\": {\n\
      \                \"source\": [\n                    [\"日期\", \"开盘价\", \"最高价\"\
      , \"最低价\", \"收盘价\", \"成交量\"],\n                    *[[dates[i], open_prices[i],\
      \ high_prices[i], low_prices[i], close_prices[i], volumes[i]] \n           \
      \           for i in range(len(dates))]\n                ]\n            },\n\
      \            \"xAxis\": [\n                {\"type\": \"category\", \"gridIndex\"\
      : 0},\n                {\"type\": \"category\", \"gridIndex\": 1}\n        \
      \    ],\n            \"yAxis\": [\n                {\n                    \"\
      gridIndex\": 0,\n                    \"name\": \"价格趋势（单位：点）\"\n            \
      \    },\n                {\n                    \"gridIndex\": 1,\n        \
      \            \"name\": \"成交量（单位：亿）\"\n                }\n            ],\n  \
      \          \"grid\": [\n                {\"bottom\": \"55%\"},\n           \
      \     {\"top\": \"55%\"}\n            ],\n            \"series\": [\n      \
      \          # 第一个网格中的折线图系列\n                {\"type\": \"line\", \"seriesLayoutBy\"\
      : \"row\", \"name\": \"开盘价\"},\n                {\"type\": \"line\", \"seriesLayoutBy\"\
      : \"row\", \"name\": \"最高价\"},\n                {\"type\": \"line\", \"seriesLayoutBy\"\
      : \"row\", \"name\": \"最低价\"},\n                {\"type\": \"line\", \"seriesLayoutBy\"\
      : \"row\", \"name\": \"收盘价\"},\n                # 第二个网格中的柱状图系列\n           \
      \     {\"type\": \"bar\", \"xAxisIndex\": 1, \"yAxisIndex\": 1, \"name\": \"\
      成交量\"}\n            ]\n        }\n        \n        # 生成输出文件\n        output\
      \ = \"```echarts\\n\" + json.dumps(echarts_config, indent=2, ensure_ascii=False)\
      \ + \"\\n```\"\n        \n        # 返回结果\n        return {\n            \"result\"\
      : output\n        }\n    \n    except Exception as e:\n        return {\n  \
      \          \"result\": f\"Error: {str(e)}\"\n        }"
    code_language: python3
    desc: ''
