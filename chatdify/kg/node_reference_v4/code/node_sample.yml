- data:
    code: |
      def main(search_json: list) -> dict:
          try:
              if search_json is None:
                  return {"url_list": [], "is_valid": False, "err_msg": "search_json 为空"}
              batches = search_json if isinstance(search_json, list) else [search_json]
              url_list = []
              seen = set()
              for batch in batches:
                  if not isinstance(batch, dict):
                      continue
                  for item in batch.get("results") or []:
                      if not isinstance(item, dict):
                          continue
                      url = (item.get("url") or "").strip()
                      if not url or url in seen:
                          continue
                      seen.add(url)
                      url_list.append(url)
              if not url_list:
                  return {"url_list": [], "is_valid": False, "err_msg": "未从 Tavily json 中解析到有效 URL"}
              return {"url_list": url_list, "is_valid": True, "err_msg": ""}
          except Exception as e:
              return {"url_list": [], "is_valid": False, "err_msg": str(e)}
    code_language: python3
    desc: 解析 tool_tavily_search 的 json 输出，提取 URL 字符串列表
    outputs:
      err_msg:
        children: null
        type: string
      is_valid:
        children: null
        type: boolean
      url_list:
        children: null
        type: array[string]
    selected: false
    title: 解析Tavily搜索结果
    type: code
    variables:
    - value_selector:
      - '10000002'
      - json
      variable: search_json
