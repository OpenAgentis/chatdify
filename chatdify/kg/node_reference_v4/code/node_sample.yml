- data:
    code: "import requests\nimport json\n\ndef main(imagerurl: str, apikey: str) ->\
      \ dict:\n    # 设置请求的URL和Headers\n    url = \"https://api.siliconflow.cn/v1/chat/completions\"\
      \n    headers = {\n        \"authorization\": f\"Bearer {apikey}\",\n      \
      \  \"content-type\": \"application/json\"\n    }\n\n    # 添加中文提示词\n    prompt_text\
      \ = \"请提取图片信息里面的内容，并使用中文回答。\"\n\n    payload = {\n        \"model\": \"Pro/OpenGVLab/InternVL2-8B\"\
      ,\n        \"messages\": [\n            {\n                \"role\": \"user\"\
      ,\n                \"content\": [\n                    {\n                 \
      \       \"type\": \"image_url\",\n                        \"text\": prompt_text,\n\
      \                        \"image_url\": {\n                            \"url\"\
      : imagerurl.split('(', 1)[1].split(')', 1)[0],\n                           \
      \ \"detail\": \"auto\"\n                        }\n                    }\n \
      \               ]\n            }\n        ],\n        \"stream\": False,\n \
      \       \"max_tokens\": 1024,\n        \"temperature\": 0.3,\n        \"top_p\"\
      : 0.7,\n        \"top_k\": 50,\n        \"frequency_penalty\": 0.5,\n      \
      \  \"n\": 1,\n        \"response_format\": {\"type\": \"text\"}\n    }\n\n \
      \   # 发送POST请求\n    response = requests.post(url, headers=headers, json=payload)\n\
      \n    # 提取结果并返回\n    if response.status_code == 200:\n        result = response.json()\n\
      \        # 检查result中是否有choices字段\n        if \"choices\" in result:\n      \
      \      # 获取第一个choice的内容\n            content = result[\"choices\"][0][\"message\"\
      ][\"content\"]\n            return {\"result\": content}\n        else:\n  \
      \          return \"Error: No choices found in the response.\"\n    else:\n\
      \        return f\"Error: {response.status_code}, {response.text}\""
