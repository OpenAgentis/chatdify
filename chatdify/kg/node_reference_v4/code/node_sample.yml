- data:
    code: "import json\n\ndef main(text: str, enabled_summary: str) -> dict:\n   \
      \ json_obj = extract_json_response(text)\n    summary = '福'\n    if enabled_summary\
      \ == '开启':\n        summary = json_obj['summary']\n    return {\n        \"\
      banner\": json_obj['banner'],\n        \"reversed_banner\": json_obj['banner'][::-1],\n\
      \        \"top\": json_obj['top'],\n        \"bottom\": json_obj['bottom'],\n\
      \        \"summary\": summary,\n    }\n\ndef extract_json_response(text: str)\
      \ -> dict:\n\n    def extract_json(text):\n        stack = []\n        for i,\
      \ c in enumerate(text):\n            if c == \"{\":\n                stack.append(c)\n\
      \            elif c == \"}\":\n                if not stack:\n             \
      \       return text[:i]\n                if c == \"}\" and stack[-1] == \"{\"\
      :\n                    stack.pop()\n                    if not stack:\n    \
      \                    return text[: i + 1]\n                else:\n         \
      \           return text[:i]\n        return None\n\n    for idx in range(len(text)):\n\
      \        if text[idx] == \"{\":\n            json_str = extract_json(text[idx:])\n\
      \            if json_str:\n                return json.loads(json_str)\n"
    code_language: python3
    desc: ''
    outputs:
      banner:
        children: null
        type: string
      bottom:
        children: null
        type: string
      reversed_banner:
        children: null
        type: string
      summary:
        children: null
        type: string
      top:
        children: null
        type: string
    selected: false
    title: 代码执行
