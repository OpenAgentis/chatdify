- data:
    code: |
      def main(page_text) -> dict:
          try:
              import json

              text = str(page_text or "").strip()
              if not text:
                  return {"title": "", "description": "", "url": "", "content": "", "is_valid": False, "err_msg": "JinaReader text 为空"}
              payload = json.loads(text)
              if not isinstance(payload, dict):
                  return {"title": "", "description": "", "url": "", "content": "", "is_valid": False, "err_msg": "JinaReader text 不是 JSON 对象"}
              if payload.get("code") != 200 and payload.get("status") != 20000:
                  return {"title": "", "description": "", "url": "", "content": "", "is_valid": False, "err_msg": "JinaReader 返回状态异常"}
              data = payload.get("data") or {}
              if not isinstance(data, dict):
                  return {"title": "", "description": "", "url": "", "content": "", "is_valid": False, "err_msg": "JinaReader data 不是对象"}
              content = str(data.get("content") or "").strip()
              if not content:
                  return {"title": "", "description": "", "url": "", "content": "", "is_valid": False, "err_msg": "JinaReader data.content 为空"}
              return {
                  "title": str(data.get("title") or ""),
                  "description": str(data.get("description") or ""),
                  "url": str(data.get("url") or ""),
                  "content": content,
                  "is_valid": True,
                  "err_msg": "",
              }
          except Exception as e:
              return {"title": "", "description": "", "url": "", "content": "", "is_valid": False, "err_msg": str(e)}
    code_language: python3
    desc: 解析 tool_jina_reader 的 text JSON 字符串，从 data 中提取标题和正文
    outputs:
      content:
        children: null
        type: string
      description:
        children: null
        type: string
      err_msg:
        children: null
        type: string
      is_valid:
        children: null
        type: boolean
      title:
        children: null
        type: string
      url:
        children: null
        type: string
    selected: false
    title: 解析JinaReader正文
    type: code
    variables:
