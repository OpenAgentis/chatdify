      ^```json\\n([\\s\\S]*)\\n```\"\n    matched = re.match(pattern, text, re.MULTILINE)\n\
      \    if not matched:\n        return {\"result\": \"None\"}\n    jsonstr = matched.group(1)\n\
      \    obj = json.loads(jsonstr)\n    contents = []\n    for chapter in obj:\n\
      \        for subtitle in chapter['contents']:\n            contents += [\n \
      \               {\n                    \"chapter\": chapter[\"chapter\"],\n\
      \                    \"title\": chapter[\"title\"],\n                    \"\
      subtitle\": subtitle,\n                }\n            ]\n    return {\n    \
      \    \"result\": contents,\n    }"
