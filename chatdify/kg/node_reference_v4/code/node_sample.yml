- data:
    code: |
      def main(doc_text) -> dict:
          try:
              import pytablereader as ptr
              tables = list(ptr.MarkdownTableTextLoader(doc_text or "").load())
              if not tables:
                  return {"rows": [], "err_msg": "未解析到 Markdown 表格"}
              df = tables[0].as_dataframe()
              rows = df.fillna("").astype(str).to_dict(orient="records")
              return {"rows": rows, "err_msg": ""}
          except Exception as e:
              return {"rows": [], "err_msg": str(e)}
    code_language: python3
    desc: 解析 document-extractor 的 Markdown 表格 text，禁止 csv.DictReader/read_csv
    outputs:
      err_msg:
        children: null
        type: string
      rows:
        children: null
        type: array[object]
    selected: false
    title: 解析Markdown表格
    type: code
    variables:
