- data:
    code: "def main(arg1: str,arg2: str) -> dict:\n    import json\n\n    # 解析输入的\
      \ JSON 数据\n    try:\n        data = json.loads(arg1)\n    except json.JSONDecodeError:\n\
      \        return {\"result\": \"输入的字符串不是有效的 JSON 格式，请检查输入数据。\"}\n\n    # 确保解析后的数据包含\
      \ 'data' 键\n    if not isinstance(data, dict) or 'data' not in data:\n     \
      \   return {\"result\": \"输入的数据格式不正确，请确保输入是一个包含 'data' 键的 JSON 对象。\"}\n\n  \
      \  # 获取 'data' 键对应的数组数据\n    image_data = data.get('data', [])\n\n    # 确保 'data'\
      \ 键的值是一个列表\n    if not isinstance(image_data, list):\n        return {\"result\"\
      : \"输入的数据中 'data' 键的值不是一个数组，请确保其值是一个 JSON 数组对象。\"}\n\n    # 初始化结果字符串\n    strn\
      \ = \"\"\n\n    # 遍历每条图片数据\n    for index, item in enumerate(image_data, start=1):\n\
      \        # 检查每条数据是否是字典，并且包含 'url' 字段\n        if not isinstance(item, dict)\
      \ or 'url' not in item:\n            strn += f\"图片第{index}条内容：无法提取 URL（缺少 'url'\
      \ 字段）\\n\"\n            continue\n\n        # 提取 URL 并生成 Markdown 格式的图片链接\n\
      \        url = item['url']\n        strn += url + \"\\n\"\n\n    # 将输入字符串转换为表格格式\n\
      \    str2 = strn\n    table = [[arg2, str2, \"\", \"\", \"\"]]\n\n    # 将表格转换为字符串形式的嵌套列表，并添加转义字符\n\
      \    result_str = str(table).replace(\"'\", '\"')  # 将单引号替换为双引号\n\n    # 返回结果\n\
      \    return {\n        \"result\": result_str,\n    }\n"
    code_language: python3
    desc: ''
    outputs:
      result:
        children: null
        type: string
