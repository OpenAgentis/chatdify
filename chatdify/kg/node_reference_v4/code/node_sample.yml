- data:
    code: "from pathlib import Path\nPath.home = lambda: Path(\"/dependencies/home\"\
      )\n\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport io\nimport\
      \ base64\n\ndef generate_base64_plot():\n    # 数据准备\n    x = np.linspace(0,\
      \ 10, 100)\n    y = np.sin(x)\n    \n    # 创建图形\n    plt.figure(figsize=(8,\
      \ 6))  # 设置画布大小为 800x600 像素\n    plt.plot(x, y, label='Sine Wave', color='blue',\
      \ linewidth=2)\n    \n    # 添加标题和标签\n    plt.title('Sine Wave Example', fontsize=16)\n\
      \    plt.xlabel('X-axis', fontsize=12)\n    plt.ylabel('Y-axis', fontsize=12)\n\
      \    \n    # 添加网格和图例\n    plt.grid(True, linestyle='--', alpha=0.6)\n    plt.legend(fontsize=12)\n\
      \    \n    # 使用内存缓冲区保存图片为Base64字符串\n    buffer = io.BytesIO()\n    plt.savefig(buffer,\
      \ format='png', dpi=100)  # 使用 100 DPI 保存，确保像素为 800x600\n    buffer.seek(0)\
      \  # 将缓冲区指针回到起点\n    base64_str = base64.b64encode(buffer.read()).decode('utf-8')\n\
      \    buffer.close()\n    plt.close()  # 关闭绘图对象，释放资源\n    \n    return base64_str\n\
      \n\ndef main():\n    base64_image = generate_base64_plot()\n    return {\"result\"\
      : base64_image}\n"
    code_language: python3
    desc: ''
    outputs:
      result:
        children: null
        type: string
    selected: true
    title: 代码执行
    type: code
    variables: []
