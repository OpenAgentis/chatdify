edge_usage:
  节点类型: end
  使用规范:
      - 结束节点定义工作流程结束的最终输出内容，每个工作流在完整执行后都需要至少一个结束节点用于输出最终结果
      - 结束节点为流程终止节点，后面无法再添加其他节点，只有运行到结束节点才会输出执行结果
      - 在工作流的最后阶段输出处理结果，若流程中出现条件分叉则需要定义多个结束节点
      - 必须声明一个或多个输出变量，声明时可以引用任意上游节点的输出变量
      - Chatflow内不支持结束节点，仅适用于Workflow工作流
      - 支持流式参数配置，可以设置依赖关系和变量选择器映射
  应用场景:
    适用场景:
      - 作为工作流终止节点，可引用任意上游节点输出变量（支持文本、数字、文件、数组等所有数据类型）。
      - 常见场景包括：工作流终点输出、多节点结果汇总、条件分支终点、最终结果展示。
      - 汇总并输出整个流程的最终结果，收集多个上游节点的输出数据。
      - 输出社交媒体内容生成结果（如小红书、抖音、Twitter等平台的内容和标签）。
      - 输出多语言检查结果（中文检查、英文检查、日文检查）。
      - 输出教程生成结果（教程名称和完整教程内容）。
      - 输出语音合成结果（文本回答和语音文件）。
      - 输出翻译结果（完整的代码翻译结果）。
      - 输出视频描述信息（视频标题、双语简介、时间轴和标签）。
      - 输出新闻内容聚合数据。
      - 输出文字识别结果（Markdown格式的文本内容）。
      - 输出图片生成结果（包含图片URL的Markdown字符串）。
      - 输出会议纪要生成结果。
    不适用场景:
      - Chatflow内不支持结束节点，仅适用于Workflow工作流。
      - 不能作为中间处理节点使用，结束节点后面无法再添加其他节点。
  常见使用错误: ""