edge_usage:
  节点类型: if-else
  使用规范:
      - if-else 节点用于在工作流中实现条件分支逻辑，根据设定的条件判断执行不同的分支路径。
      - 支持多个条件分支（cases），每个分支可以包含多个条件，条件之间可以使用 "and" 或 "or" 逻辑运算符连接。
      - 根据条件判断结果，工作流将执行对应的分支路径，实现复杂的业务逻辑控制。
      - sourceHandle不能使用source"，sourceHandle是具体的分支id表示，建议使用"true"或者"false"
  应用场景:
    适用场景:
      - 多轮对话流程控制：根据对话轮次（dialogue_count）控制流程走向，实现不同阶段的对话处理
      - 内容类型判断：根据发票类型代码、文件类型、输入内容等进行分类路由
      - 数据完整性检查：验证多个LLM节点输出内容是否完整，确保所有必要内容都已准备就绪
      - 登录状态验证：检查用户token是否存在，判断用户登录状态
      - 处理路径选择：根据用户输入参数选择不同的处理分支（如单图仿写/多图仿写）
      - 条件分支逻辑：支持包含、不包含、开始是、结束是、是、不是、为空、不为空等条件判断
      - 多重条件判断：支持AND/OR逻辑运算符连接多个条件
      - 业务流程控制：根据业务状态进行流程分流，如会议文件处理、API文档处理等
      - 质量控制决策：检查LLM生成内容是否合理，决定是否触发优化流程
      - 记忆更新控制：根据对话轮次计数控制短期记忆的追加频率
    不适用场景:
      - if-else节点不进行数据计算，仅作为流程控制
  常见使用错误: ""