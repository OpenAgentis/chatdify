edge_usage:
  节点类型: iteration-start
  使用规范:
      - Iteration-Start 节点是 Dify Chatflow/Workflow 中迭代流程的起始节点，用于标记迭代的开始位置。
      - 该节点必须位于 Iteration 节点内部，作为迭代流程的入口点和控制节点。
      - 不包含具体的功能逻辑，仅作为流程控制节点，用于连接迭代器和后续处理节点。
      - 会将上游传入的数组数据拆分为单个元素，并传递给下游节点进行逐一处理。
      - 该节点不可拖动且不可选中，属于迭代结构的固定组成部分。
      - 适用于需要对数组或列表数据进行逐项处理的场景，如批量数据处理、循环操作等。
      - 不能有入边
      - 至少有一个出边
  应用场景:
    适用场景:
      - 迭代流程的起始连接：作为迭代循环的入口点，连接迭代器和后续处理节点
      - 并行处理的起始：在并行迭代模式下作为多任务同时处理的起点
    不适用场景:
      - 独立使用：不能脱离Iteration节点单独使用
      - 直接数据处理：不包含具体功能逻辑，不能直接处理业务数据
  常见使用错误:
    - 多个iteration-start节点冲突，一个Iteration节点内只能有一个iteration-start节点