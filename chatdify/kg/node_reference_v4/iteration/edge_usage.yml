edge_usage:
  节点类型: iteration
  使用规范:
      - 迭代节点用于对数组中的元素依次执行相同的操作步骤，直至输出所有结果，可以理解为任务批处理器。
      - 迭代节点的输出变量(output_selector)引用必须是迭代体内部节点的输出，不能引用迭代外部的节点变量作为输出。
      - 迭代节点的输入变量(iterator_selector)必须是数组类型，不能为空，不能是字符串(string)，不能是对象(object)，不能是数字(number)。
      - 支持并行模式，最高并行轮数为 10，可以有效提升迭代节点的整体运行效率。
      - 提供三种错误响应方法：错误时终止、忽略错误并继续、移除错误输出。
      - iteration 内部默认不需要 assigner 收集结果；批处理结果应通过 iteration.output_selector 指向迭代体内部最终节点的输出，由 iteration 节点自动汇总为数组。
      - 只有在明确需要写入 conversation.* 会话变量、跨轮保存状态、或任务要求把每轮结果追加/覆盖到可写变量时，才考虑在 iteration 内使用 assigner；使用时必须能说明为何 output_selector 不能满足需求。
  节点配对规则:
      - iteration和iteration-start类型节点必须同时存在
      - 迭代内节点不能与迭代外节点连接
      - "迭代内的节点定义出现在isInIteration: true边中的节点。"
      - 迭代外节点：不包含在迭代内的节点。
      - iteration类型节点的直接前置节点的输出类型必须是数组Array。
      - iteration类型节点的直接前置节点可以考虑是code类型或者parameter-extractor类型。
  迭代内边属性说明:
      - "isInIteration: true"
      - "iteration_id: 迭代节点ID"
      - iteration_id 不能等于 target
      - iteration_id 不能等于 source
      - "zIndex: 1002"
      - '违反示例: {{"iteration_id": "10000005", "target": "10000005"}} '
  应用场景:
    适用场景:
      - 批量任务处理：对数组中的元素依次执行相同的操作步骤，实现任务批处理功能
      - 长文分段处理：将长文拆分为多个片段，配合迭代节点对各个片段执行批量翻译或处理
      - 数据循环操作：遍历数组数据，对每个元素进行相同的处理流程
      - 多元素并行处理：支持并行模式，最高并行轮数为10，提升整体运行效率
      - 长篇故事生成：按章节生成长篇故事内容，逐章节处理详细文本
      - 新闻正文抓取：循环处理新闻数据数组，批量抓取新闻正文内容
      - 关键词批量检索：对关键词列表进行批量知识检索处理
      - 文章段落处理：处理文章段落拆分后的多个章节内容
      - 代码生成迭代：为函数/类签名生成对应的完整代码实现
      - URL批量处理：对URL数组进行逐个处理并汇总结果
      - 课程内容生成：循环处理课程大纲中的每个章节和子标题
      - 子任务循环处理：对复杂问题进行逐步拆解和分步处理
    不适用场景:
      - 非数组类型数据处理：迭代节点仅接受Array数组变量类型数据，不支持其他数据格式
      - 单一元素处理：不适用于处理单个元素或非列表结构的数据
      - 仅为了汇总每轮输出而加入 assigner：应改用 iteration.output_selector
  常见使用错误: 
      - 输入变量不是数组(array)， 'invalid iterator value： value_type=<SegmentType.STRING：''string''> value='''' id=''2a778872-c94b-4709-99f4-d8359fb6a994'' name=''key_findings'' description='''' selector=[''10000005'', ''key_findings''], please provide a list.'
      - 迭代内LLM/code引用{{#迭代ID.item.xx#}}报错，应先用迭代内code解析item再引用子字段；output_selector须指向子图内节点真实输出字段（如revised_en_content），不能写不存在的result
      - 普通 workflow 批处理在 iteration 内引入 assigner 追加结果，导致流程复杂且下游无法引用 assigner 输出；若只是收集每轮结果，应删除 assigner 并让 iteration.output_selector 指向内部最终节点输出