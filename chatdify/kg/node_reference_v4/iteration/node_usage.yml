node_usage:
  节点类型: iteration
  输入规范:
      - 节点接受以下参数：
          - iterator_selector：迭代器选择器，必须是列表格式，仅接受 Array 数组变量类型数据。
          - output_selector：输出选择器，必须是列表格式，用于指定输出变量。
          - start_node_id：开始节点ID，不能为空。
          - is_parallel：并行模式配置，布尔值。
          - parallel_nums：并行数量，当启用并行模式时必须指定，范围为 1-100。
          - error_handle_mode：错误处理模式，支持 terminated、continue、remove_error_outputs。
      - 迭代器选择器路径不能为空，必须指向有效的数组变量。
      - 输出选择器用于指定迭代处理后的输出变量格式。
  常见使用错误:
      - 迭代器选择器不能为空：确保配置了有效的迭代器选择器。
      - 迭代器选择器必须是列表格式：确保选择器是正确的列表格式。
      - 迭代器选择器路径不能为空：确保选择器路径有效。
      - 输出选择器不能为空：确保配置了输出选择器。
      - 输出选择器必须是列表格式：确保输出选择器是正确的列表格式。
      - 输出选择器路径不能为空：确保输出选择器路径有效。
      - 缺少开始节点ID配置：确保配置了开始节点ID。
      - 开始节点ID不能为空：确保开始节点ID有效。
      - 启用并行模式时必须指定并行数量：当is_parallel为true时，必须配置parallel_nums。
      - 并行数量必须是整数：确保parallel_nums是整数类型。
      - 并行数量必须大于等于 1：确保parallel_nums在有效范围内。
      - 并行数量不能超过 100：确保parallel_nums不超过最大限制。
      - 无效的错误处理模式：确保error_handle_mode是支持的值之一。
      - 输出变量错误：确保输出变量在节点中存在且类型正确，例如节点的可用输出与配置的输出不匹配。
      - 迭代器变量验证失败：确保迭代器变量存在且类型正确。
      - 迭代器变量类型可能不兼容：建议使用数组类型变量作为迭代器输入。