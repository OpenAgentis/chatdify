edge_usage:
  节点类型: knowledge-retrieval
  使用规范:
      - 知识检索节点用于从知识库中检索与用户问题相关的文本内容，可作为下游 LLM 节点的上下文来使用。
      - 查询变量必须是字符串(string)类型，不能为空，不能为object，不能为array
      - 使用多路召回模式。
      - 支持元数据筛选功能，可以通过元数据条件筛选知识库内的文档。
  应用场景:
    适用场景:
      - RAG系统构建：从知识库中检索与用户问题相关的文本内容，作为AI问答系统的核心组件
      - 客服知识库检索：基于用户查询从指定数据集中检索相关信息，用于客服回复生成
      - 多知识库联合检索：支持同时从多个知识库中检索内容，提供更全面的信息覆盖
      - 语义重排序优化：通过重排序模型对检索结果进行优化，确保返回结果与用户查询高度相关
      - 迭代检索处理：在迭代节点内部进行知识检索，支持批量关键词的并行检索操作
      - 分类后检索：配合问题分类器使用，根据分类结果进行针对性的知识检索
      - 上下文增强：为LLM节点提供外部知识作为上下文，增强回答的准确性和相关性
    不适用场景:
      - 文件系统操作：不能用于直接的文件读写操作
      - 外部API调用：不能替代HTTP请求节点进行外部服务调用
  常见使用错误: ""