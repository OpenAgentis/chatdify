edge_usage:
  节点类型: list-operator
  使用规范:
    - 列表操作节点用于对数组变量进行过滤、排序、提取等操作，将数组变量转化为能够被下游节点所接受的变量类型
    - 主要用于处理文件列表变量，支持同时上传文档文件、图片、音频与视频文件等多种文件类型
    - 可以对文件的格式类型、文件名、大小等属性进行过滤与提取，将不同格式的文件传递给对应的处理节点
    - 适用于混合文件处理场景，例如将文档文件分流至文档提取器节点，图片文件分流至LLM节点
    - 支持过滤条件、排序、取前N项等功能，可以单独开启或组合使用
    - 输出结果包括过滤后的数组、首元素和尾元素，便于下游节点处理
  应用场景:
    适用场景:
      - 文件分类处理：将混合文件类型（文档、图片、音频、视频）分流到不同的处理节点
      - 数组元素提取：从数组变量中提取特定元素，如首元素、尾元素或满足条件的元素
      - 条件筛选：基于文件属性（类型、大小、名称、扩展名等）进行过滤操作
      - 数据排序与限制：对数组元素进行排序并限制输出数量（1-20项）
      - 文档图片分离：将文档文件分流至文档提取器节点，图片文件分流至LLM节点
      - 论文分析结果提取：从会话变量中提取最后一条记录作为上下文
      - 多媒体文件处理：根据文件类型将不同格式文件传递给对应的处理节点
    不适用场景:
      - 非数组类型数据处理：不能处理单一值或非数组结构的数据
  常见使用错误: ""