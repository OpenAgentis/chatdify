edge_usage:
  节点类型: llm
  使用规范:
      - LLM节点是工作流应用的核心节点，调用大语言模型的能力，处理输入的信息（自然语言、上传的文件或图片），给出有效的回应信息。 
      - 该节点能够利用大语言模型的对话/生成/分类/处理等能力，根据给定的提示词处理广泛的任务类型，并能够在工作流的不同环节使用。 
      - 支持聊天模式（Chat model）和补全模式（Completion model）两种工作模式。
      - 提供易用的提示词编排页面，支持系统提示词(SYSTEM)/用户(USER)/助手(ASSISTANT)三部分内容配置。
  应用场景:
    适用场景:
      - 连接知识检索节点，构建RAG知识问答系统
      - 连接参数提取节点，进行结构化数据处理
      - 连接模板转换节点，进行文本格式转换
      - 连接条件分支节点，实现智能决策流程
      - 连接迭代节点，进行批量内容生成
      - 连接代码执行节点，进行数据分析处理
      - 连接HTTP请求节点，处理外部API数据
      - 连接工具节点，实现功能扩展
      - 连接变量聚合节点，整合多源数据
      - 连接答案节点，输出最终结果
    不适用场景:
      - 不能直接连接到自身形成循环
      - 不能作为工作流的唯一终点（需要连接输出节点）
  常见使用错误: ""