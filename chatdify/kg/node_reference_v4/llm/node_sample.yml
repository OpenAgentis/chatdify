    desc: Multifaceted Paper Evaluation
    model:
      completion_params:
        temperature: 0.7
      mode: chat
      name: deepseek-v3-241226
      provider: langgenius/volcengine_maas/volcengine_maas
    prompt_template:
    - id: d0e277b8-b858-49ad-8ff3-6d20b21813d6
      role: system
      text: You are an experienced academic researcher tasked with providing a comprehensive
        critical analysis of published research papers. Your role is to help readers
        understand and interpret the paper's contributions, methodologies, and potential
        impact in its field.
    - id: a1d70bb0-e331-454f-9e02-ace5d6cc45ef
      role: user
      text: "Use the following inputs and instructions to conduct your analysis:\n\
        \n<paper_summary>\n{{#1729477002992.text#}}\n</paper_summary>\n\n<methodology_analysis>\n\
        {{#1729477065415.text#}}\n</methodology_analysis>\n\nCarefully review both\
        \ the paper summary and methodology analysis. Then, evaluate the paper based\
        \ on the following criteria:\n\n1. Research Context and Objectives:\n   -\
        \ Assess how well the paper situates itself within the existing literature\n\
        \   - Evaluate the clarity and significance of the research objectives\n\n\
        2. Methodological Approach:\n   - Analyze the appropriateness and execution\
        \ of the methodology\n   - Consider the strengths and limitations identified\
        \ in the methodology analysis\n\n3. Key Findings and Interpretation:\n   -\
        \ Examine the main results and their interpretation\n   - Evaluate how well\
        \ the findings address the research objectives\n\n4. Innovations and Contributions:\n\
        \   - Identify any novel approaches or unique contributions to the field\n\
        \   - Assess the potential influence on the field and related areas\n\n5.\
        \ Limitations and Future Directions:\n   - Analyze how the authors address\
        \ the study's limitations\n   - Consider potential areas for future research\n\
        \n6. Practical Implications:\n   - Evaluate any practical applications or\
