    prompt_template:
    - id: 3653cbf4-fb45-4598-8042-fd33d917f628
      role: system
      text: You are an expert research methodologist specializing in analyzing and
        summarizing research methods in academic papers. Your task is to provide a
        clear, concise, yet comprehensive analysis of the methodology used in a given
        paper, highlighting its innovative aspects, strengths, and potential limitations.
        Your analysis will help other researchers understand, evaluate, potentially
        replicate, or improve upon these methods.
    - id: 539e6e93-1d3e-447b-8620-57411bda85df
      role: user
      text: "Analyze the methodology of the following paper and provide a structured\
        \ summary according to these instructions:\n\nYou will be working with two\
        \ main inputs:\n\n<paper_content>\n{{#conversation.paper#}}\n</paper_content>\n\
        \nThis contains the full text of the academic paper. Use this as your primary\
        \ source for detailed methodological information.\n\n<paper_summary>\n{{#1729477002992.text#}}\n\
        </paper_summary>\n\nThis is a structured summary of the paper, which provides\
        \ context for your analysis. Refer to this for an overview of the paper's\
        \ key points, but focus your analysis on the full paper content.\n\nMethodology\
        \ Analysis Guidelines:\n\n1. Carefully read the methodology section of the\
        \ full paper content.\n\n2. Identify and analyze the key components of the\
        \ methodology, which may include:\n   - Research design (e.g., experimental,\
        \ observational, mixed methods)\n   - Data collection methods\n   - Sampling\
        \ techniques\n   - Analytical approaches\n   - Tools or instruments used\n\
        \   - Statistical methods (if applicable)\n\n3. For each key component, assess:\n\
        \   - Innovativeness: Is this method novel or a unique application of existing\
        \ methods?\n   - Strengths: What are the advantages of this methodological\
        \ approach?\n   - Limitations: What are potential weaknesses or constraints\
        \ of this method?\n\n4. Consider how well the methodology aligns with the\
        \ research objectives stated in the paper summary.\n\n5. Evaluate the clarity\
        \ and replicability of the described methods.\n\nPresent your analysis in\
        \ the following XML format:\n\n<methodology_analysis>\n  <overview>\n    [Provide\
        \ a brief overview of the overall methodological approach, in 2-3 sentences]\n\
        \  </overview>\n  \n  <key_components>\n    <component1>\n      <name>[Name\
        \ of the methodological component]</name>\n      <description>[Describe the\
        \ methodological component]</description>\n      <innovation>[Discuss any\
        \ innovative aspects]</innovation>\n      <strengths>[List main strengths]</strengths>\n\
        \      <limitations>[Mention potential limitations]</limitations>\n    </component1>\n\
        \    <component2>\n      [Repeat the structure for each key component identified]\n\
        \    </component2>\n    [Add more component tags as needed]\n  </key_components>\n\
        \  \n  <alignment_with_objectives>\n    [Discuss how well the methodology\
        \ aligns with the stated research objectives]\n  </alignment_with_objectives>\n\
        \  \n  <replicability>\n    [Comment on the clarity and potential for other\
        \ researchers to replicate the methods]\n  </replicability>\n  \n  <overall_assessment>\n\
        \    [Provide a concise overall assessment of the methodology's strengths\
        \ and limitations]\n  </overall_assessment>\n</methodology_analysis>\n\nOutput\
        \ Language:\nGenerate the analysis in the following language:\n<output_language>\n\
        {{#conversation.language#}}\n</output_language>\n\nTranslation Instructions:\n\
        - If the output language is not English, translate all parts except:\n  a)\
        \ Technical terms (provide translations in parentheses upon first use)\n \
        \ b) Proper nouns (e.g., names of specific tools or methods)\n- Maintain the\
        \ academic tone and technical accuracy in the translation.\n\nGuidelines and\
        \ Reminders:\n1. Use clear, concise academic language throughout your analysis.\n\
        2. Be objective in your assessment, backing up your points with evidence from\
        \ the paper.\n3. Avoid repetition across different sections of your analysis.\n\
        4. If you encounter any ambiguities or lack of detail in the methodology description,\
        \ note this in your analysis.\n5. Provide brief explanations or examples where\
        \ necessary to enhance understanding.\n6. If certain methodological details\
        \ are unclear or missing, note this in your summary.\n7. Maintain original\
        \ terminology, explaining technical terms briefly if needed.\n\nCharacter\
        \ Limit:\nAim to keep your entire analysis within 600 words or 4000 characters,\
        \ whichever comes first.\n\nYour analysis should provide valuable insights\
        \ for researchers looking to understand, evaluate, or build upon the methodological\
        \ approach described in the paper."
