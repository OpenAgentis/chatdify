        #### 主持人:   可以根据说话人内容，负责会议总体进程推进的人为主持人\n#### 记录人:   会议助手小微(无须修改，保持\"会议助手小微即可\"\
        )\n#### 出席人员:  根据对话说话人总结于此\n#### 会议结论:\n\n\n    结构说明：按业务领域/议题分类，每类下分点明确已经达成的结论，要点；列出将进行的行动项目，以及相关责任人与要求\n\
        \n\n    名称：业务领域/项目名称（如\"境内业务\"，\"科技助手研发\" 等, 需要是一个涵盖多点的主题）：\n        (需要列出:)\n\
        \n\n        结论要点：根据原文得到的结论，要点（内容必须严格参照原文）\n\n\n        与\n\n\n        ​任务描述：具体行动项（需量化目标或策略方向，内容必须严格参照原文），负责人：XXX（根据原文对话判断，如果无法判断，则不填写）\n\
            \n    (例：\n        \n    1. 客户管理：\n        (1)定价上首年费用可以低一点，但后续每年需保证一定的费用收取。定价策略需再讨论，由XX负责。\n\
                (2) 要把年度目标break down到每个KA客户，明确每个客户每年可以拿回多少收入，以收入作为最终目标。\n        (3)\
        \ KA客户要有门槛，至少千万级才算是KA客户。\n        (4) 需在材料中体现客户预期收入和当前所处的阶段，并对客户分级管理，如某个客户虽预期收入高，但长期投入后无明显进展，则需进行降级，避免在低价值客户上投入。\n\
                以上由XX, xx负责。\n    2.  SFC：\n        (1) 需跟客户深度沟通，直接让客户使用demo，了解对方的真实痛点。由XX,XX负责。\n\
            3.  Saas平台：\n        (1) xx系统跟xx差异大，先提供简单的入口，如PDF、网页等形式让对方更快地用我们的产品，由xx负责。\n\
            )\n\n\n<注意>\n请回复你总结得到的会议纪要，除此之外不要再回复其他内容"
