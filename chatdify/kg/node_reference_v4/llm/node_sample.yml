        接收并解析两个待比对的 JSON 数据\",\n    \"确保两个 JSON 数据结构一致，如果不一致，报告结构差异\",\n    \"逐一比对每个键值对：\"\
        ,\n    \"  - 如果键不同，标记为新增或缺失\",\n    \"  - 如果值不同，使用红色高亮标注\",\n    \"生成详细的比对报告，包括：\"\
