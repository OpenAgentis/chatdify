        \n  ],\n\n  \"Rules\": [\n    \"必须逐个键值对进行比较，不遗漏任何字段\",\n    \"只标注存在差异的部分，相同部分保持原样\"\
        ,\n    \"使用红色作为差异标注的唯一颜色\",\n    \"对于数值型差异，需要考虑精度问题\",\n    \"对于字符串差异，需要考虑大小写和空白字符\"\
