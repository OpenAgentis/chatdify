edge_usage:
  节点类型: loop-start
  使用规范:
    节点位置:
      - 必须位于Loop节点内部
      - 作为循环体的第一个节点
      - 不能独立存在于循环结构外部
    节点属性:
      - draggable: false（不可拖动）
      - selectable: false（不可选中）
      - type: custom-loop-start
      - isInLoop: true（必须在循环内）
    连接规范:
      - 无直接上游节点（作为循环内部起始点）, 即不能有入边
      - 下游节点：LLM、代码执行、条件分支、变量赋值等循环体内的处理节点
      - 边连接必须设置loop_id与父Loop节点ID一致
      - 至少有一个出边
  应用场景:
    适用场景:
      - 循环流程控制：作为循环体的起始标记节点
      - 循环结构入口标记：标记循环的开始位置
      - 循环逻辑起点定位：作为循环控制逻辑的辅助节点
      - 循环内部起始点连接：连接到LLM、代码执行、条件分支、变量赋值等循环体内的处理节点
    不适用场景:
      - 独立存在于循环结构外部
  常见使用错误:
    - loop_id不匹配：边连接的loop_id与父Loop节点ID不一致
    - 缺少下游节点：loop-start节点后没有连接处理节点
    - 多个loop-start：同一个Loop节点内存在多个loop-start节点