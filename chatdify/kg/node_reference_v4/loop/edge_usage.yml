edge_usage:
  节点类型: loop
  使用规范:
      - 循环节点用于执行依赖前一轮结果的重复任务，直到满足退出条件或达到最大循环次数。
      - 与迭代节点不同，循环节点的轮次之间存在依赖关系，每一轮执行都依赖上一轮的结果。 
      - 适用于需要基于前一轮计算结果进行优化的任务场景，如数值收敛、条件满足等。
      - 支持循环变量在不同轮次间传递数据，并在循环结束后供下游节点使用。 
      - 提供退出循环节点，可在循环体内部主动终止循环。 
  节点配对规则:
      - loop-start和loop类型节点必须同时存在
      - 循环内节点不能与循环外节点连接
      - "循环内的节点定义：出现在isInLoop: true边中的节点。"
      - 循环外节点：不包含在迭代内的节点。
  循环内边属性说明:
      - "isInLoop: true"
      - "loop_id: 循环节点ID"
      - loop_id 不能等于 target
      - loop_id 不能等于 source
      - "zIndex: 1002"
      - '违反示例: {{"loop_id": "10000004", "target": "10000004"}} '
  应用场景:
    适用场景:
      - 优化型任务处理，如随机数生成直到满足条件
      - 迭代改进任务，如诗歌逐步重写
      - 质量评估循环，如翻译质量达标检查
      - 依赖前轮结果的计算任务
      - 数值收敛计算
      - 条件满足检查循环
      - 基于前一轮计算结果进行优化的任务场景
      - 循环变量在不同轮次间传递数据
      - 循环体内部主动终止循环的场景
    不适用场景:
      - 无限循环场景（必须设置最大循环次数或终止条件）
      - 轮次之间无依赖关系的批处理任务
  常见使用错误: ""