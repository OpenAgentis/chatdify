node_usage:
  节点类型: loop
  输入规范:
      - 节点接受以下参数：
          - 最大循环次数（loop_count）：整数类型，限制最多执行的轮次，避免无限循环。 
          - 循环终止条件（break_conditions）：条件列表，设置循环何时停止的具体条件。 
              - 比较运算符（comparison_operator）：支持 =、≠、>、<、≥、≤ 等运算符。
              - 变量选择器（variable_selector）：引用变量池中的变量进行条件判断。
              - 比较值（value）：用于条件比较的目标值。
              - 变量类型（varType）：指定变量的数据类型（string、number、boolean等）。
          - 逻辑运算符（logical_operator）：当有多个终止条件时，指定条件间的逻辑关系（"and" 或 "or"）。
          - 起始节点ID（start_node_id）：指定循环体内的起始节点。
          - 循环变量：用于在循环的不同轮次间传递数据的变量配置。
            - 变量标签（label）：变量的唯一标识符，用于在循环体内引用,不能是中文。
            - 变量值（value）：变量的值，可以是常量或列表。
            - 变量类型（var_type）：指定变量的数据类型（string、number、boolean等）。
            - 变量值类型（value_type）：指定变量的值类型（constant、variable等）。
      - 错误处理模式（error_handle_mode）：指定错误处理方式，如 "terminated"（终止）。
  常见使用错误:
      - 配置错误：
          - 起始节点ID不能为空：确保配置了 start_node_id 字段。
          - 循环图未找到：检查循环体内的节点配置是否正确。
          - 最大循环次数必须为正整数：确保 loop_count 为大于0的整数。
      - 条件配置错误：
          - 终止条件变量不存在：确保 break_conditions 中引用的变量存在于变量池中。
          - 变量选择器格式错误：检查 variable_selector 的格式是否正确。
          - 比较运算符无效：确保使用支持的比较运算符。
          - 逻辑运算符错误：logical_operator 只能为 "and" 或 "or"。
      - 运行时错误：
          - 循环索引变量未找到：系统无法获取当前循环的索引值。
          - 循环体执行失败：循环内部节点执行出现错误导致整个循环失败。
          - 变量类型不匹配：条件判断时变量类型与预期不符。
          - 无限循环风险：未设置合理的终止条件可能导致循环无法正常结束。
      - 数据流错误：
          - 循环变量引用错误：确保循环变量的配置和引用正确。
          - 前置节点输出缺失：循环依赖的前置节点输出变量不存在。
          - 变量池状态异常：循环过程中变量池状态不一致。