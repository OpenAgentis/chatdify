edge_usage:
  节点类型: parameter-extractor
  使用规范:
      - 参数提取节点利用 LLM 从自然语言推理并提取结构化参数，用于后置的工具调用或 HTTP 请求。
      - 它可以将用户的自然语言转换为工具可识别的参数，方便工具调用。
      - 也可以实现结构化参数的转换，如将文本格式的章节内容转换为数组格式，方便迭代节点进行多轮生成处理。
      - 适用于从自然语言中提取工具所需的关键参数，如构建对话式 Arxiv 论文检索应用。
      - 可以提取结构化数据并用于 HTTP 请求，适用于获取外部检索结果、webhook、生成图片等情景。
  应用场景:
    适用场景:
      - 工具参数提取：从自然语言中提取工具所需的关键参数，如构建对话式Arxiv论文检索应用
      - 文本格式转换：将文本格式的章节内容转换为数组格式，方便迭代节点进行多轮生成处理
      - 网页内容清洗：从网页内容中抽取文章的核心信息，去除HTML标签、页头页尾等无关信息
      - 问题拆解：从LLM生成的问题拆解结果中提取步骤数组
      - 关键词提取：从指定文本中提取关键词用于后续搜索或分析
      - 响应数据解析：从HTTP请求的响应体中提取特定数据如图片链接
      - 内容结构化处理：分析文章内容结构并生成图片检索关键词
      - 结构化数据提取：用于HTTP请求，适用于获取外部检索结果、webhook、生成图片等情景
  常见使用错误: ""