- data:
    desc: ''
    instruction: "请分析文章的内容结构，将文本划分为一个或多个语义完整的章节，每个章节不少于400字。并为每个章节生成若干个用于检索图片的关键词或描述，多个关键词使用逗号进行分割。输出结构为json\n\
      Example:{\n    \"sections\": [\n        {\n           ”keywords“: ”关键词或描述字符串“,\n\
      \           ”section“: \"章节内容1\"\n        },\n        {\n           ”keywords“:\
      \ ”关键词或描述字符串“,\n           ”section“: \"章节内容2\"\n        },\n         {\n  \
      \         ”keywords“: ”关键词或描述字符串“,\n           ”section“: \"章节内容2\"\n      \
      \  }\n    ]\n}\n"
    model:
      completion_params:
        temperature: 1
      mode: chat
      name: deepseek-chat
      provider: deepseek
    parameters:
    - description: 多个文章段落
      name: sections
      required: true
      type: array[object]
    query:
    - '17190400701430'
    - content
    reasoning_mode: prompt
    selected: false
    title: 段落拆分-关键词生成
    type: parameter-extractor
    variables: []
  id: '1719046777534'
  selected: false
