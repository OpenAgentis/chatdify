- data:
    desc: ''
    instruction: '请对以下网页内容进行清洗，并抽取网页中的文章内容信息。请避免包含文章内容无关的信息，例如：html标签、页头、页尾。请对清洗后的信息进行markdown的格式输出。请对抽取的完整正文进行智能分段并保留原文的配图信息。



      ### 约束条件

      1.文本信息中如果有明显的标题信息请直接抽取，不需要自定义生成或加工

      2.文本的正文内容请尊重原本描述抽取，不需要自定义生成或加工

      3.关键词将用作图片多模态检索，请不要包含无意义的词组或短语。

      4.请完整抽取原文内容，并保持段落排版

      5.请过滤版权信息、编辑、作者、来源、转载以及与原文内容无关的信息



      ### 抓取内容如下：

      ```

      {{#1718967141318.text#}}

      ```'
    model:
      completion_params:
        temperature: 1
      mode: chat
      name: deepseek-chat
      provider: deepseek
    parameters:
    - description: 原文标题
      name: title
      required: true
      type: string
    - description: 原文完整内容
      name: content
      required: false
      type: string
    - description: 关键词信息
      name: keywords
      required: true
      type: string
    query:
    - '1718967141318'
    - text
    reasoning_mode: prompt
    selected: false
    title: 留图-原文内容抽取
    type: parameter-extractor
    variables: []
  id: '17190386712500'
  selected: false
  type: custom
