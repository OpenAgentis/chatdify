node_usage:
  节点类型: parameter-extractor
  输入规范:
      - 查询变量（query）：
          - 必须配置查询变量，不能为空
          - 用于提取参数的变量输入，支持 file 类型
          - 查询变量必须存在于变量池中
      - 模型配置：
          - 必须选择模型，参数提取器的提取依靠 LLM 的推理和结构化生成能力
      - 参数列表（parameters）：
          - 参数列表不能为空
          - 每个参数的名称不能为空
          - 参数类型必须是支持的类型：'string', 'number', 'bool', 'select', 'array[string]', 'array[number]', 'array[object]'
          - 可以手动添加需要提取的参数，也可以从已有工具中快捷导入
          - 注意：对于数组输出，除非是复杂的多类型数据混合，否则请不要使用array[object]，如文本等单一字符串类型请使用 array[string]，其他单一类型请使用对应类型
      - 指令（可选）：
          - 在提取复杂的参数时，编写示例可以帮助 LLM 提升生成的效果和稳定性
      - 高级设置：
          - 推理模式：支持 Function Call/Tool Call 或 Prompt 模式
          - 记忆：开启后将包含对话中的聊天历史
          - 图片：支持图片输入处理
  常见使用错误:
      - 查询变量错误：
          - 查询内容不能为空
          - 查询变量必须存在于变量池中
      - 参数配置错误：
          - 参数列表不能为空
          - 参数名称不能为空
          - 参数类型必须是支持的类型，不能使用 'object' 类型
      - 变量引用错误：
          - 引用的节点不是当前节点的前置节点
          - 引用的节点类型不能被作为变量引用（如 if-else 节点）
      - 输出变量错误：
          - 引用了不存在的输出变量（如使用 'output' 而实际输出变量是具体的参数名）
          - 节点的可用输出变量与引用的变量名不匹配
      - Pydantic 验证错误：
          - 节点配置数据不符合 ParameterExtractorNodeData 模型的要求
          - 参数类型验证失败
      - 运行时错误：
          - LLM 模型调用失败
          - JSON 解析错误（如字符串未正确终止、转义字符错误）
          - 模型推理错误或超时