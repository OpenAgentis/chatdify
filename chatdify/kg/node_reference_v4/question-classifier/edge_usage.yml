edge_usage:
  节点类型: question-classifier
  使用规范:
      - 问题分类器通过定义分类描述，根据用户输入，使用 LLM 推理与之相匹配的分类并输出分类结果，向下游节点提供更加精确的信息。
      - 常见的使用情景包括客服对话意图分类、产品评价分类、邮件批量分类等。
      - 可以作为知识库检索的前置步骤，对用户输入问题意图进行分类处理，分类后导向下游不同的知识库查询相关的内容。
      - 支持根据分类结果选择不同的下游节点，实现分支逻辑控制。
      - 适用于需要根据用户意图进行不同处理流程的场景。
      - sourceHandle不能使用source", sourceHandle是具体的分支id表示, sourceHandle建议使用"1"到"10"
  应用场景:
    适用场景:
      - 客服对话意图分类：根据用户输入问题进行意图识别和分类
      - 产品评价分类：对用户反馈和评价进行自动分类处理
      - 邮件批量分类：对大量邮件进行自动分类和路由
      - 知识库检索前置分类：作为知识库检索的前置步骤，对用户输入问题意图进行分类处理
      - 分支逻辑控制：根据分类结果选择不同的下游节点，实现分支逻辑控制
      - 多路径工作流：根据用户意图进行不同处理流程的场景
      - 文件分析请求分类：区分纯文件分析请求和图表绘制请求
      - 健康咨询分类：区分健康咨询和使用帮助类问题
  常见使用错误: ""