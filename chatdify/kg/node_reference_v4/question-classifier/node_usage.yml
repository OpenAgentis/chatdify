node_usage:
  节点类型: question-classifier
  输入规范:
      - 查询变量选择器（query_variable_selector）：
          - 必须配置查询变量选择器，不能为空
          - 指用于分类的输入内容，支持输入文件变量
          - 客服问答场景下一般为用户输入的问题 sys.query
          - 查询变量必须存在于变量池中
      - 推理模型：
          - 必须选择推理模型，问题分类器基于大语言模型的自然语言分类和推理能力
          - 选择合适的模型将有助于提升分类效果
      - 分类标签/描述：
          - 可以手动添加多个分类
          - 通过编写分类的关键词或者描述语句，让大语言模型更好的理解分类依据
      - 下游节点选择：
          - 问题分类节点完成分类之后，可以根据分类与下游节点的关系选择后续的流程路径
      - 指令（instruction，可选）：
          - 可以在高级设置-指令里补充附加指令，比如更丰富的分类依据，以增强问题分类器的分类能力
          - 指令中的变量选择器必须存在于变量池中
      - 高级设置：
          - 记忆：开启后问题分类器的每次输入将包含对话中的聊天历史，以帮助 LLM 理解上文，提高对话交互中的问题理解能力
          - 图片分析：仅适用于具备图片识别能力的 LLM，允许输入图片变量
          - 记忆窗口：记忆窗口关闭时，系统会根据模型上下文窗口动态过滤聊天历史的传递数量；打开时用户可以精确控制聊天历史的传递数量
  常见实用错误:
      - 查询变量选择器错误：
          - 查询变量选择器不能为空
          - 查询变量必须存在于变量池中
      - JSON 格式错误：
          - 无效的 JSON 对象，缺少逗号分隔符
          - 属性名称必须用双引号括起来
          - JSON 格式不正确导致解析失败
      - 指令变量选择器错误：
          - 指令中引用的变量选择器必须存在于变量池中
          - 变量选择器验证过程发生错误
      - 变量引用错误：
          - 引用的节点不是当前节点的前置节点
          - 引用的变量在变量池中不存在
      - 模型配置错误：
          - 未正确配置推理模型
          - 模型不支持所需的功能（如图片分析）
      - 分类配置错误：
          - 分类标签或描述配置不当
          - 分类逻辑不清晰导致分类效果差
      - 输出变量错误：
          - class_name 输出变量使用不当
          - 下游节点无法正确接收分类结果