edge_usage:
  节点类型: start
  使用规范:
      - 开始节点是每个工作流应用（Chatflow / Workflow）必备的预设节点，为后续工作流节点以及应用的正常流转提供必要的初始信息。
      - 提供应用使用者所输入的内容、上传的文件等初始数据。
      - 支持配置输入字段，让应用使用者主动补全更多信息，如姓名、工作日期区间、工作详情等。
      - 支持文本、段落、下拉选项、数字、复选框、单文件、文件列表六种输入类型
      - 支持文档类型文件、图片、音频、视频和其它文件类型。支持通过本地上传文件或粘贴文件 URL
      - 不能有入边
      - 至少有一个出边
  应用场景:
    适用场景:
      - 搭建多轮次对话应用、收集应用日志与监控、记录不同应用和用户的使用行为等进阶开发场景
      - 播客生成流程的起点，收集文件上传、语气选择、主持人姓名、嘉宾姓名、语言选择等参数
      - 代码翻译任务的输入参数收集，包括代码文件内容、文件名、源语言、目标语言等
      - API文档处理的入口，收集本地文档或URL、额外说明、编程语言选择等
      - 会议相关数据的接收，包括会议文档、会议录音、上下文关键词、发言人数等
      - 翻译任务的基本输入参数收集，包括源语言、目标语言、待翻译文档等
      - 下游可连接LLM、文档提取器、代码执行等任意节点
    不适用场景:
      - 不能作为中间节点使用，只能作为工作流的起始节点
      - 不支持接收来自其他节点的输入数据
  常见使用错误: ""