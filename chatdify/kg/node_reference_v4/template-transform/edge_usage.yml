edge_usage:
  节点类型: template-transform
  使用规范:
      - 模板转换节点允许借助 Jinja2 的 Python 模板语言灵活地进行数据转换、文本处理等。
      - 适用于文本处理、JSON 转换等情景，例如灵活地格式化并合并来自前面步骤的变量，创建出单一的文本输出。
      - 非常适合于将多个数据源的信息汇总成一个特定格式，满足后续步骤的需求。
      - 支持渲染 HTML 表单、Markdown 格式化、结构化数据转换等复杂场景。
  应用场景:
    适用场景:
      - 借助Jinja2的Python模板语言灵活地进行数据转换、文本处理
      - 多变量文本拼接格式化，将多个数据源的信息汇总成一个特定格式
      - JSON/XML数据结构组装和转换
      - HTML/SVG模板渲染，支持渲染HTML表单
      - API请求体构建，将多个组件输出合并为完整的请求体
      - 数据格式转换，如将知识检索节点获取的信息整理成结构化的Markdown格式
      - 内容结构化输出，如研究报告各部分内容整合成结构化文档
      - 图片渲染配置生成，如封面图的文本配置、图片配置等
      - 表单模板生成，如用户登录表单
      - 错误信息格式化，如网页内容获取失败时的错误提示
      - Markdown格式转换，如将URL转换为Markdown图片显示语法
      - 播客脚本合并，将主体内容与总结部分连接
      - 会议记录文本格式化，将多个LLM节点输出按指定格式组合
      - 论文对话prompt结构化，将用户查询与论文信息结合生成对话prompt
      - 春联内容可视化展示，将上联、下联、横批等元素组合成传统风格展示
      - 新闻内容格式化拼接，将多条新闻正文用分隔线连接
      - 文章段落组合，将迭代处理后的多个段落组合成完整文章
    不适用场景:
      - 超出Jinja2模板语言能力范围的复杂逻辑处理
  常见使用错误: ""