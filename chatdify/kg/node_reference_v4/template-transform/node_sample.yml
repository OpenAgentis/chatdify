- data:
    desc: 将用户输出转换为prompt
    selected: false
    template: "Engage in a conversation about the research paper based on the following\
      \ inputs and instructions:\r\n\r\n<paper_info>\r\n{{ last_record }}\r\n</paper_info>\r\
      \n\r\nInteraction Guidelines:\r\n\r\n1. Carefully analyze the user's query:\r\
      \n   <user_query>\r\n   {{ query }}\r\n   </user_query>\r\n\r\n2. Determine\
      \ the specific aspect of the paper the query relates to (e.g., research question,\
      \ methodology, results, implications).\r\n\r\n\r\n3. Formulate a response based\
      \ on the information provided in the paper summary, methodology analysis, and\
      \ evaluation.\r\n\r\n\r\n4. If the query requires information beyond what's\
      \ provided, state this limitation clearly.\r\n\r\n\r\n5. Offer additional insights\
      \ or explanations that might be relevant to the user's question, drawing from\
      \ your understanding of the research context.\r\n\r\n\r\nResponse Strategies:\r\
      \n\r\n\r\n1. For questions about methodology:\r\n   - Refer to the methodology\
      \ analysis for detailed explanations.\r\n   - Explain the rationale behind the\
      \ chosen methods if discussed.\r\n   - Highlight strengths and limitations of\
      \ the methodology.\r\n\r\n\r\n2. For questions about results and findings:\r\
      \n   - Provide clear, concise summaries of the key findings.\r\n   - Explain\
      \ the significance of the results in the context of the research question.\r\
      \n   - Mention any limitations or caveats associated with the findings.\r\n\r\
      \n\r\n3. For questions about implications or impact:\r\n   - Discuss both theoretical\
      \ and practical implications of the research.\r\n   - Relate the findings to\
      \ broader issues in the field if applicable.\r\n   - Mention any future research\
      \ directions suggested by the paper.\r\n\r\n\r\n4. For comparative questions:\r\
      \n   - If the information is available, compare aspects of this paper to other\
      \ known research.\r\n   - If not available, clearly state that such comparison\
      \ would require additional information.\r\n\r\n\r\n5. For technical or specialized\
      \ questions:\r\n   - Provide explanations that balance accuracy with accessibility.\r\
      \n   - Define technical terms when first used.\r\n   - Use analogies or examples\
      \ to clarify complex concepts when appropriate.\r\n\r\n\r\nLanguage and Expression:\r\
      \n\r\n\r\n- Use clear, concise academic language.\r\n- Maintain a balance between\
      \ scholarly rigor and accessibility.\r\n- When appropriate, use topic sentences\
      \ to structure your response clearly.\r\n\r\n\r\nHandling Limitations:\r\n\r\
      \n\r\n- If a question goes beyond the scope of the provided information, clearly\
      \ state this limitation.\r\n- Suggest general directions for finding such information\
      \ without making unfounded claims.\r\n- Be honest about the boundaries of your\
      \ knowledge based on the given paper analysis.\r\n\r\n\r\nOutput Language:\r\
      \nGenerate the response in the following language:\r\n<output_language>\r\n\
      {{ language }}\r\n</output_language>\r\n\r\n\r\nTranslation Instructions:\r\n\
      - If the output language is not English, translate all parts except:\r\n  a)\
      \ Technical terms (provide translations in parentheses upon first use)\r\n \
      \ b) Proper nouns (e.g., names of theories, methods, or authors)\r\n- Maintain\
      \ the academic tone and technical accuracy in the translation.\r\n\r\n\r\nFinal\
      \ Reminders:\r\n1. Strive for accuracy in all your responses.\r\n2. Encourage\
      \ deeper understanding by suggesting related aspects the user might find interesting.\r\
      \n3. If a query is ambiguous, ask for clarification before providing a response.\r\
      \n4. Maintain an objective tone, particularly when discussing the paper's strengths\
      \ and limitations.\r\n5. If appropriate, suggest areas where further research\
      \ might be beneficial.\r\n6. Your responses should be human reading friendly\
      \ and the display form and render will be markdown\r\n\r\n\r\nYour goal is to\
      \ facilitate a productive, insightful dialogue about the research paper, enhancing\
      \ the user's understanding and encouraging critical thinking about the research."
    title: 格式化输入
    type: template-transform
    variables:
    - value_selector:
      - conversation
      - language
      variable: language
    - value_selector:
      - sys
      - query
      variable: query
    - value_selector:
      - '1729478231227'
      - last_record
      variable: last_record
