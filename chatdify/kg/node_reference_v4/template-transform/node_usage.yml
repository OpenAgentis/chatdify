node_usage:
  节点类型: template-transform
  输入规范:
      - 模板内容（template）：
          - 必须提供非空的 Jinja2 模板内容
          - 支持 Jinja2 语法，包括变量引用、循环、条件判断等
          - 模板语法必须正确，不能包含语法错误
      - 变量配置（variables）：
          - 必须至少定义一个变量
          - 每个变量包含两个必要字段：
              - variable：变量名称（必填，不能为空）
              - value_selector：变量选择器（必填，必须是 Sequence 类型的数组）
          - 变量名格式要求：
              - 必须以字母或下划线开头
              - 只能包含字母、数字和下划线
              - 符合 Jinja2 变量名规范
          - 变量名不能重复
          - 变量选择器不能重复（不能有多个变量引用相同的数据源）
      - 变量选择器（value_selector）：
          - 必须是数组格式，如 ["节点ID", "输出变量名"]
          - 不能是字典格式，如 {"value":"内容", "variable":"变量名"}
          - 引用的节点必须是当前节点的前置节点
          - 引用的输出变量必须存在于目标节点的可用输出中
  常见使用错误:
      - 基础配置错误：
          - "模板内容不能为空"：template 字段为空或只包含空白字符
          - "至少需要定义一个变量"：variables 数组为空
      - 变量配置错误：
          - "变量名不能为空"：variable 字段为空或只包含空白字符
          - "变量名重复"：多个变量使用相同的变量名
          - "变量名格式无效"：变量名不符合 Jinja2 规范（如包含特殊字符、以数字开头等）
          - "变量选择器重复"：多个变量引用相同的数据源
      - Pydantic 验证错误：
          - "Input should be an instance of Sequence"：value_selector 使用字典格式而非数组格式
          - "Field required"：缺少必要的 value_selector 字段
      - 变量引用错误：
          - "节点不是当前节点的前置节点"：引用了不在前置节点列表中的节点
          - "输出变量错误"：引用的输出变量名不存在于目标节点的可用输出中
          - 迭代节点变量引用错误：引用迭代节点时输出变量名必须为 item（迭代内部引用）或 output（迭代外部引用）
          - LLM 节点变量引用错误：LLM 节点的输出变量名必须为 text
      - 模板语法错误：
          - "模板语法错误:unexpected char '#'"：模板中包含 Jinja2 不支持的字符或语法
          - "模板中引用了未定义的变量"：模板中使用了未在 variables 中定义的变量
          - "定义了但未在模板中使用的变量"：variables 中定义了变量但模板中未使用（警告性错误）
      - 运行时错误：
          - "UndefinedError"：模板渲染时变量未定义或访问了不存在的属性
          - "Output length exceeds 80000 characters"：输出内容超过长度限制
          - Jinja2 模板渲染异常：模板执行过程中发生的各种运行时错误