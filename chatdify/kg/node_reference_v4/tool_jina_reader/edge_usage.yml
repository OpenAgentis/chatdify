edge_usage:
  节点类型: tool_jina_reader
  使用规范:
    - Jina Reader工具节点是一个专门用于单个网页内容抓取和解析的工具节点，只能接受单个url作为输入
    - 只能抓取单个网页链接，如果需要爬取多网页，需要在迭代或循环内部使用该工具，接收单个url作为变量作为输入
    - 主要功能是从指定URL获取网页内容，支持多种内容格式输出（文本、Markdown、JSON等）
    - 支持高级网页解析功能：iframe解析、shadow DOM解析、图片采集、链接汇总等
    - 可配置重试机制、缓存策略、代理服务器等高级选项
  应用场景:
    适用场景:
      - 网页内容抓取和解析：从指定URL获取网页内容，支持多种内容格式输出（文本、Markdown、JSON等）
      - 接收来自start节点的用户输入URL，进行单页面内容获取
      - 文档抓取：获取在线API文档、GitHub仓库文档等内容
      - 数据采集：支持高级网页解析功能，包括iframe解析、shadow DOM解析、图片采集、链接汇总
      - 接收来自if-else节点的条件分支输出，根据条件执行网页抓取
      - 输出内容可传递给variable-aggregator节点进行数据聚合
      - 输出内容可传递给code节点进行后续数据处理
      - 输出内容可传递给LLM节点进行文本分析和摘要处理
      - 支持目标选择器、移除选择器、等待选择器等精确内容提取
  常见使用错误: 将多个url作为输入，会导致无法解析