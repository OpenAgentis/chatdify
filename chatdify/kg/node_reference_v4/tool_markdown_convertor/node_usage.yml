node_usage:
  节点类型: tool_markdown_convertor
  输入规范:
    - 工具名称（tool_name）：支持多种转换工具：
      - md_to_docx： Word file (.docx)
      - md_to_pdf： PDF file (.pdf)
      - md_to_md： Markdown file (.md)
      - md_to_pptx： PowerPoint file (.pptx)
      - md_to_xlsx： Excel file (.xlsx)
      - md_to_csv： CSV file (.csv)
      - md_to_json： JSON file (.json)
      - md_to_html： HTML file (.html)
      - md_to_html_text： HTML text
      - md_to_xml： XML file (.xml)
      - md_to_latex： LaTeX file (.tex)
      - md_to_rst： reStructuredText file (.rst)
      - md_to_epub： Epub file (.epub)
      - md_to_png： PNG image (.png) of generated PDF pages
      - md_to_codeblock： Code block files (.py/.sh/.js/.xml等)
      - md_to_linked_image： Image files from linked URLs
    - 提供者ID（provider_id）：固定为"bowenliang123/md_exporter/md_exporter"
    - 提供者类型（provider_type）：固定为"builtin"
    - version：固定为'2'
    - 核心参数（tool_parameters）：
      - md_text：必填参数，Markdown格式文本
        - type：支持"mixed"、"variable"、"constant"类型
        - value：Markdown文本内容，支持变量引用和模板语法
      - output_filename：可选参数，自定义输出文件名
        - type：通常为"mixed"类型
        - value：文件名字符串，后缀名无需指定
    - 工具配置（tool_configurations）：
      - compression：是否启用压缩
        - type：constant
        - value：0
        - 说明：默认不压缩，设为1时将多个文件打包为ZIP
      - json_style：JSON输出格式
        - type：constant
        - value："jsonl"
        - 说明：支持"jsonl"（默认）和"array"两种格式
      - template_file：PPTX模板文件
        - type：constant
        - value：null
        - 说明：可指定自定义PPTX模板文件路径
      - sheet_name_from_heading：是否从标题生成工作表名
        - type：constant
        - value：1
        - 说明：Excel文件中使用Markdown标题作为工作表名
      - autofit_column_width：是否自动调整列宽
        - type：constant
        - value：1
        - 说明：Excel文件中自动调整列宽以适应内容
      - force_string_type：是否强制字符串类型
        - type：constant
        - value：1
        - 说明：防止Excel中数据精度丢失和显示问题
      - image_download_timeout：图片下载超时时间
        - type：constant
        - value：30
        - 说明：下载链接图片的超时时间（秒）
      - max_file_size_mb：最大文件大小限制
        - type：constant
        - value：100
        - 说明：PDF文件大小限制（MB）
  常见使用错误:
    - 基础配置错误：
      - md_text参数为空或格式不正确
      - 工具版本不正确，必须设置为'2'
      - 选择了不存在的工具名称
    - 格式转换错误：
      - PPTX转换时Markdown未遵循md2pptx语法规范
      - 表格转换时Markdown表格格式不规范
      - 代码块提取时未正确标注语言类型
    - 文件输出错误：
      - 自定义文件名包含非法字符
      - 输出文件超过大小限制
      - 网络图片链接无效或超时
    - 变量引用错误：
      - 引用不存在的变量或节点输出
      - 在迭代中引用错误的迭代变量