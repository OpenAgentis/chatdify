edge_usage:
  节点类型: tool_tavily_search
  使用规范:
    - TavilySearch工具节点是一个内置工具，用于执行网络搜索任务
    - 提供者为tavily，属于builtin类型，需要先进行授权配置
    - 支持多种搜索配置选项，包括搜索深度、结果数量、内容过滤等
    - 可以配置包含或排除特定域名，控制搜索范围
    - 支持返回答案、图片、原始内容等不同类型的搜索结果
    - 通常用于获取网络信息，为后续节点提供搜索数据
    - 输出结果可传递给其他节点进行进一步处理
  应用场景:
    适用场景:
      - 接收用户提问作为搜索查询
      - 通常用于获取网络信息，为后续节点提供搜索数据
  常见使用错误: ""