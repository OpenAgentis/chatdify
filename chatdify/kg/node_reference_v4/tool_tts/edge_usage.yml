edge_usage:
  节点类型: tool_tts
  使用规范:
    - 文本转语音工具节点是一个专门用于将文本内容转换为高质量语音音频的AI工具节点
    - 使用硅基流（SiliconFlow）平台的FunAudioLLM/CosyVoice2-0.5B模型进行语音合成
    - 主要接受文本内容（text）作为输入，生成对应的音频文件
    - 支持多种语音风格：anna（女声）、charles（男声）等预配置音色
    - 输出高质量的音频文件格式（如WAV、MP3等）
  应用场景:
    适用场景:
      - 语音播报：将文本内容转换为语音进行播报和朗读
      - 接收来自LLM节点生成的文本内容，转换为可听的语音输出
      - 有声内容制作：为文章、新闻、故事等文本内容生成配套语音
      - 多媒体内容生成：结合图像描述文本生成语音解说
      - 接收来自start节点的用户输入文本，直接生成对应语音
      - 无障碍服务：为视觉障碍用户提供文本到语音的转换服务
      - 语音助手应用：将AI回复内容转换为自然语音输出
      - 教育培训：生成课程内容的语音版本
      - 输出音频可传递给answer节点或end节点作为工作流结果
    连接模式:
      - 输入连接：可接收来自LLM节点、start节点、variable-aggregator节点的文本内容
      - 输出连接：生成的音频通常连接到answer节点或end节点作为最终输出
      - 支持在迭代和循环中使用，处理批量文本到语音的转换需求
      - 可与其他工具节点串联，如先处理文本再进行语音合成
  常见使用错误: ""