edge_usage:
  节点类型: variable-aggregator
  使用规范:
      - variable-aggregator 用于将"互斥分支"汇聚为单一输出，使下游节点只需配置一次即可处理所有分支结果。
      - 适用前提：上游必须是"每次只有一条路径执行"的互斥分支（如 if-else、question-classifier 等条件性分支），不能用于合并并行执行的分支。
      - 不同上游分支的同类输出汇聚后，下游通过该聚合节点的统一输出变量引用，无需在每条分支上重复配置下游处理逻辑。
      - 通常不作为工作流终点，需要继续连接 LLM、code、answer、end 等下游节点输出结果。
  应用场景:
    适用场景:
      - 条件分支结果汇聚：将 if-else 的 true/false 等多分支的同类输出聚合为单路
      - 问题分类器结果汇聚：将 question-classifier 的多个分类分支的输出聚合为单路
      - 互斥流程下游统一处理：多条互斥路径产生相同类型的输出时，下游只需基于聚合输出处理一次
    不适用场景:
      - 不合并"并行执行"分支的输出（多个分支同时执行的场景请使用 code节点合并）
      - 不汇聚多个并行运行的 LLM/工具/HTTP 等节点的同时输出（这属于并行分支合并，不在适用范围）
      - 不作为工作流的最终输出节点（不能替代 answer / end）
      - 不引入新计算逻辑，仅做变量汇聚，不要承担条件判断或数据加工
      - 不能直接连接到自身形成循环
    常见使用错误:
      - 并行分支误用聚合器：多个 LLM/工具/HTTP 等节点同时执行，却将其输出全部接入 variable-aggregator；运行期通常只能保留其中一条分支的结果，其余分支输出会丢失。
      - 正确做法：改用 code 节点接收各并行分支输出，合并为 array 或 object 后再交给下游；variable-aggregator 仅适用于 if-else、question-classifier 等互斥分支。
