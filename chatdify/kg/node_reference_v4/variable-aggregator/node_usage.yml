node_usage:
  节点类型: variable-aggregator
  输入规范:
    - 变量列表（variables）：必填，不能为空，包含要聚合的变量选择器列表
    - 变量选择器格式：必须是有效的列表格式，格式为 [节点ID, 变量名]，不能为字典格式
    - 变量选择器不能重复
    - 所有变量选择器必须引用存在于变量池中的变量
    - 引用的节点必须是当前节点的前置节点
    - 高级设置（advanced_settings）：可选配置
      - 分组启用（group_enabled）：布尔值，是否启用分组功能
      - 分组列表（groups）：必填字段；group_enabled 为 false 时写 groups 为空数组 []；group_enabled 为 true 时每组需含 groupId、group_name、output_type、variables
        - 分组ID（groupId）：唯一标识符
        - 分组名称（group_name）：不能为空
        - 分组输出类型（output_type）：不能为空
        - 分组变量列表（variables）：不能为空，包含该分组的变量选择器
  常见使用错误:
    - 基础配置错误：
      - 变量列表不能为空
    - 变量配置错误：
      - 变量选择器重复
      - 变量引用错误：引用的变量不存在于变量池中
      - 变量引用错误：引用的节点不是当前节点的前置节点
      - 引用的输出变量名不存在
    - Pydantic验证错误：
      - 变量选择器格式错误：应该是有效的列表格式 [节点ID, 变量名]，而不是字典格式
      - 数据类型不匹配：尝试聚合不同数据类型的变量
      - Input should be a valid list 错误：变量选择器必须是列表格式，不能是字典
    - 分组配置错误：
      - 启用分组但未配置分组信息
      - 分组名称不能为空
      - 分组输出类型不能为空
      - 分组变量列表不能为空
      - 分组内变量引用错误
    - 数据类型限制错误：
      - 尝试在同一聚合中混合不同数据类型的变量
      - 第一个变量确定数据类型后，后续变量类型不匹配
