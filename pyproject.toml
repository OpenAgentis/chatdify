[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatdify"
dynamic = ["version"]
description = "Generate, repair and modify Dify workflow DSL with large language models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "OpenAgentis" }]
keywords = ["dify", "workflow", "llm", "agent", "dsl", "code-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "openai>=1.40",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "requests>=2.31",
    "requests-toolbelt>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Python deps needed to import Dify 1.11.2 node entities for static validation.
# Pins follow dify/api/pyproject.toml so the Dify modules behave as upstream.
dify = [
    "pydantic~=2.11.4",
    "pydantic-settings~=2.11.0",
    "httpx~=0.27.0",
    "pytz",
    "flask~=3.1.2",
    "pycryptodome==3.19.1",
    "redis~=6.1.0",
    "gmpy2~=2.2.1",
    "jsonschema>=4.25.1",
    "sqlalchemy~=2.0.29",
    "flask-login~=0.6.3",
    "flask-sqlalchemy~=3.1.1",
    "flask-restx~=1.3.0",
    "pydantic-extra-types~=2.10.3",
    "celery~=5.5.2",
    "deprecated",
    "yarl~=1.18.3",
    "orjson",
    "gevent~=25.9.1",
    "cachetools~=5.3.0",
    "psycopg2-binary~=2.9.6",
    "tenacity",
    "pandas~=2.2.2",
    "charset-normalizer>=3.4.4",
    "openpyxl~=3.1.5",
    "pyjwt~=2.10.1",
    "beautifulsoup4==4.12.2",
    "pypandoc",
    "python-docx~=1.1.0",
    "httpx-sse~=0.4.0",
    "sseclient-py~=1.8.0",
    "cloudscraper",
    "readabilipy~=0.3.0",
    "json-repair>=0.41.1",
    "pypdfium2==5.2.0",
    "webvtt-py~=0.5.1",
]
# Experimental embedding-based node pre-selection (settings.node_selector).
selector = [
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
chatdify = "chatdify.cli:main"

[project.urls]
Homepage = "https://github.com/OpenAgentis/chatdify"
Repository = "https://github.com/OpenAgentis/chatdify"
Issues = "https://github.com/OpenAgentis/chatdify/issues"

[tool.setuptools.dynamic]
version = { attr = "chatdify.__version__" }

[tool.setuptools.packages.find]
include = ["chatdify*"]
namespaces = false

[tool.setuptools.package-data]
chatdify = ["kg/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dify: requires a Dify source tree and the [dify] extra",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dify"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
# re-export modules
"__init__.py" = ["F401"]
"chatdify/dify_compat/entities.py" = ["F401"]
