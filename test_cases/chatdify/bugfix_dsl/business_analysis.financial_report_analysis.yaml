          variable: yoy_analysis
        - value_selector:
          - '10000004'
          - mom_analysis
          variable: mom_analysis
        - value_selector:
          - '10000004'
          - raw_data
          variable: raw_data
        version: '1'
        vision:
          enabled: false
      height: 200
      id: '10000005'
      parentId: null
      position:
        x: 1300
