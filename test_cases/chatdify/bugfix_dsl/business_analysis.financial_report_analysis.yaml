      width: 240
      zIndex: 3
    - data:
        code: "import json\nimport pandas as pd\nfrom datetime import datetime, timedelta\n\
          \ndef extract_json_from_markdown(markdown_text: str) -> str:\n    \"\"\"\
          从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n   \
          \ if start == -1:\n        start = markdown_text.find('```')\n        if\
          \ start == -1:\n            return markdown_text.strip()\n    \n    start\
          \ = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef calculate_growth(current:\
          \ float, previous: float) -> float:\n    \"\"\"计算增长率\"\"\"\n    if previous\
          \ == 0:\n        return 0\n    return (current - previous) / previous *\
          \ 100\n\ndef main(financial_data: str) -> dict:\n    try:\n        # 预处理输入数据\n\
          \        json_text = extract_json_from_markdown(financial_data)\n      \
          \  data = json.loads(json_text)\n        \n        # 确保有历史数据\n        if\
          \ 'historical_data' not in data or not data['historical_data']:\n      \
          \      return {\n                'error': '缺少历史数据，无法进行同比和环比分析',\n      \
          \          'yoy_analysis': None,\n                'mom_analysis': None,\n\
          \                'raw_data': None\n            }\n        \n        # 转换为DataFrame便于处理\n\
          \        df = pd.DataFrame(data['historical_data'])\n        df['date']\
          \ = pd.to_datetime(df['date'])\n        df = df.sort_values('date')\n  \
          \      \n        # 获取最新数据\n        latest_date = df['date'].max()\n    \
          \    latest_data = df[df['date'] == latest_date].iloc[0].to_dict()\n   \
          \     \n        # 同比分析（与去年同期比较）\n        yoy_results = {}\n        if len(df)\
          \ >= 13:  # 至少13个月数据才能计算同比\n            yoy_date = latest_date - timedelta(days=365)\n\
          \            yoy_data = df[df['date'] == yoy_date].iloc[0].to_dict()\n \
          \           \n            for metric in ['revenue', 'net_income', 'gross_profit']:\n\
          \                if metric in latest_data and metric in yoy_data:\n    \
          \                yoy_results[f'{metric}_yoy'] = calculate_growth(latest_data[metric],\
          \ yoy_data[metric])\n        \n        # 环比分析（与上期比较）\n        mom_results\
          \ = {}\n        if len(df) >= 2:  # 至少2个月数据才能计算环比\n            prev_date\
          \ = df[df['date'] < latest_date]['date'].max()\n            prev_data =\
          \ df[df['date'] == prev_date].iloc[0].to_dict()\n            \n        \
          \    for metric in ['revenue', 'net_income', 'gross_profit']:\n        \
          \        if metric in latest_data and metric in prev_data:\n           \
          \         mom_results[f'{metric}_mom'] = calculate_growth(latest_data[metric],\
          \ prev_data[metric])\n        \n        return {\n            'yoy_analysis':\
          \ yoy_results,\n            'mom_analysis': mom_results,\n            'raw_data':\
          \ data,\n            'error': None\n        }\n        \n    except Exception\
          \ as e:\n        return {\n            'error': str(e),\n            'yoy_analysis':\
          \ None,\n            'mom_analysis': None,\n            'raw_data': None\n\
          \        }"
        code_language: python3
        desc: 对财务数据进行同比和环比分析
        outputs:
          error:
            children: null
            type: string
          mom_analysis:
            children: null
            type: object
          raw_data:
            children: null
            type: object
          yoy_analysis:
            children: null
            type: object
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 财务同比环比分析
        type: code
