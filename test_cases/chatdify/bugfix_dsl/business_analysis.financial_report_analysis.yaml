        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        timeout: 120
        title: 可视化图表建议
        type: llm
        variables:
        - value_selector:
          - '10000003'
          - financial_ratios
          variable: financial_ratios
        - value_selector:
          - '10000004'
          - yoy_analysis
          variable: yoy_analysis
        - value_selector:
