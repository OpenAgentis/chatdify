    - data:
        code: "import json\n\ndef extract_json_from_markdown(markdown_text: str) ->\
          \ str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef main(financial_data:\
          \ str) -> dict:\n    try:\n        # 预处理输入数据\n        json_text = extract_json_from_markdown(financial_data)\n\
          \        data = json.loads(json_text)\n        \n        # 计算关键财务比率\n  \
          \      ratios = {\n            \"current_ratio\": data[\"current_assets\"\
          ] / data[\"current_liabilities\"],\n            \"quick_ratio\": (data[\"\
          current_assets\"] - data[\"inventory\"]) / data[\"current_liabilities\"\
          ],\n            \"debt_to_equity\": data[\"total_liabilities\"] / data[\"\
          total_equity\"],\n            \"gross_margin\": (data[\"revenue\"] - data[\"\
          cost_of_goods_sold\"]) / data[\"revenue\"],\n            \"net_profit_margin\"\
          : data[\"net_income\"] / data[\"revenue\"],\n            \"return_on_assets\"\
          : data[\"net_income\"] / data[\"total_assets\"],\n            \"return_on_equity\"\
          : data[\"net_income\"] / data[\"total_equity\"]\n        }\n        \n \
          \       return {\n            \"financial_ratios\": ratios,\n          \
          \  \"raw_data\": data,\n            \"error\": None\n        }\n       \
          \ \n    except Exception as e:\n        return {\n            \"financial_ratios\"\
          : None,\n            \"raw_data\": None,\n            \"error\": str(e)\n\
          \        }"
        code_language: python3
        desc: 解析财务报表数据并计算关键财务比率
