    - data:
        code: "import json\nimport yaml\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef extract_signatures(yaml_data:\
          \ dict, dest_lang: str) -> dict:\n    \"\"\"从YAML数据中提取类和函数签名\"\"\"\n   \
          \ signatures = []\n    for item in yaml_data.get(dest_lang, []):\n     \
          \   if item.get('type') in ['class', 'function']:\n            signatures.append({\n\
          \                'type': item['type'],\n                'name': item.get('name',\
          \ ''),\n                'signature': item.get('signature', '')\n       \
          \     })\n    \n    return {\n        'out_file_name': yaml_data.get('out_file_name',\
          \ ''),\n        'signatures': signatures,\n        'original_data': yaml_data\n\
          \    }\n\ndef main(text: str, dest_lang: str) -> dict:\n    try:\n     \
          \   # 预处理输入\n        yaml_text = extract_json_from_markdown(text)\n    \
          \    data = yaml.safe_load(yaml_text)\n        \n        # 提取签名\n      \
          \  result = extract_signatures(data, dest_lang)\n        \n        return\
          \ {\n            'out_file_name': result['out_file_name'],\n           \
          \ 'signatures': result['signatures'],\n            'original_data': result['original_data'],\n\
          \            'error': ''\n        }\n    except Exception as e:\n      \
          \  return {\n            'out_file_name': '',\n            'signatures':\
          \ [],\n            'original_data': {},\n            'error': str(e)\n \
          \       }"
        code_language: python3
        desc: 解析LLM生成的YAML格式输出，提取函数和类签名
        outputs:
          error:
            children: null
            type: string
          original_data:
            children: null
            type: object
          out_file_name:
            children: null
            type: string
          signatures:
            children: null
            type: array[object]
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 解析YAML并提取签名
        type: code
        variables:
        - value_selector:
          - '10000002'
          - text
          variable: text
        - value_selector:
