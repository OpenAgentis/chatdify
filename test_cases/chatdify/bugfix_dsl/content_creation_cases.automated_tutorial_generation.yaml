    - data:
        code: "def main(item: dict) -> dict:\n    \"\"\"\n    提取章节详细信息\n    输入: 单个章节数据\
          \ (来自迭代节点)\n    输出: 包含章节详细信息的字典\n    \"\"\"\n    try:\n        # 验证输入数据结构\n\
          \        if not all(key in item for key in ['chapter', 'title', 'subtitle']):\n\
          \            return {\"error\": \"Missing required chapter fields\", \"\
          result\": {}}\n            \n        # 返回章节详细信息\n        return {\n    \
          \        \"result\": {\n                \"chapter\": item[\"chapter\"],\n\
          \                \"title\": item[\"title\"],\n                \"subtitle\"\
          : item[\"subtitle\"]\n            },\n            \"error\": \"\"\n    \
          \    }\n        \n    except Exception as e:\n        return {\"error\"\
          : f\"处理过程中发生错误: {str(e)}\", \"result\": {}}"
        code_language: python3
