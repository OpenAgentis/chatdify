          \ 章节元数据 (dict)\n    输出: 包含整合后内容的字典\n    \"\"\"\n    import json\n    \n\
          \    try:\n        # 预处理输入\n        if not content or not chapter_info:\n\
          \            return {\"error\": \"缺少必要输入参数\", \"result\": {}}\n        \
          \    \n        # 构建整合后的数据结构\n        result = {\n            \"chapter\"\
          : chapter_info.get(\"chapter\", \"\"),\n            \"title\": chapter_info.get(\"\
          title\", \"\"),\n            \"subtitle\": chapter_info.get(\"subtitle\"\
          , \"\"),\n            \"content\": content,\n            \"metadata\": {\n\
          \                \"course_name\": chapter_info.get(\"course_name\", \"\"\
          ),\n                \"generated_at\": \"\"  # 可以添加时间戳等元数据\n            }\n\
          \        }\n        \n        return {\"result\": result, \"error\": \"\"\
          }\n        \n    except Exception as e:\n        return {\"error\": f\"\
          处理过程中发生错误: {str(e)}\", \"result\": {}}"
        code_language: python3
