        prompt_template:
        - id: fa51a950-08a7-45bf-936c-14aa386a2ec6
          role: system
          text: 你是一个{{#1.course_name#}}方面的专家，编写一个{{#1.course_name#}}教程的课程大纲，并仅以JSON列表的形式输出。
        - id: 4a06912a-7141-497b-a68c-b425d459a97c
          role: user
          text: 编写一个{{#1.course_name#}}教程大纲，要求从入门到精通。整理成列表，并以JSON方式输出结果。
        - id: 01f88599-5ae2-4978-a69b-1a13cc9b34be
          role: assistant
          text: "输出格式如下（每一章至少5-12篇内容）\n[\n  {\n    \"chapter\": \"第1章\",\n    \"title\"\
            : \"xxxx\",\n    \"contents\":\n    [\n        \"1.1 xxx\",\n        ...\n\
            \    ]\n  },\n  ...\n]"
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: LLM 生成课程大纲
        type: llm
        variables: []
        version: '1'
        vision:
          enabled: false
      height: 124
      id: '2'
      parentId: null
      position:
        x: 333
        y: 295
      positionAbsolute:
        x: 333
        y: 295
      type: custom
      width: 243
      zIndex: 0
    - data:
        code: "def main(text: str) -> dict:\n    import re, json\n\n    def extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n        \"\"\"从markdown提取JSON内容\"\"\"\n        start = markdown_text.find('```json')\n\
          \        if start == -1:\n            start = markdown_text.find('```')\n\
          \            if start == -1:\n                return markdown_text.strip()\n\
          \        \n        start = markdown_text.find('\\n', start) + 1\n      \
          \  end = markdown_text.rfind('```')\n        return markdown_text[start:end].strip()\n\
          \n    try:\n        # 预处理输入\n        json_text = extract_json_from_markdown(text)\n\
          \        data = json.loads(json_text)\n        \n        # 验证数据结构\n    \
          \    if not isinstance(data, list):\n            return {\"result\": [],\
          \ \"error\": \"Invalid data format: expected list of chapters\"}\n     \
          \       \n        # 转换数据结构\n        structured_data = []\n        for chapter\
          \ in data:\n            if not all(key in chapter for key in ['chapter',\
          \ 'title', 'contents']):\n                return {\"result\": [], \"error\"\
          : \"Missing required chapter fields\"}\n                \n            for\
          \ content in chapter['contents']:\n                structured_data.append({\n\
          \                    \"chapter\": chapter[\"chapter\"],\n              \
          \      \"title\": chapter[\"title\"],\n                    \"subtitle\"\
          : content\n                })\n        \n        return {\"result\": structured_data,\
          \ \"error\": \"\"}\n        \n    except json.JSONDecodeError as e:\n  \
          \      return {\"result\": [], \"error\": f\"JSON解析错误: {str(e)}\"}\n   \
          \ except Exception as e:\n        return {\"result\": [], \"error\": f\"\
          处理过程中发生错误: {str(e)}\"}"
        code_language: python3
        desc: 解析LLM生成的JSON大纲并转换为结构化数据
        outputs:
          error:
            children: null
            type: string
          result:
            children: null
            type: array[object]
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 解析JSON大纲
        type: code
        variables:
        - value_selector:
          - '2'
          - text
          variable: text
        version: '1'
