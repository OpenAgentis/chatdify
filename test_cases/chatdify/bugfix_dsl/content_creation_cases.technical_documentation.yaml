    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 为当前API端点生成详细文档
        isInIteration: true
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一位专业的API文档工程师，擅长为API端点生成详细的技术文档。请根据提供的API端点信息，生成包含以下内容的完整文档：


            1. 端点概述：简要说明API端点的功能和用途

            2. 请求方法：HTTP方法(GET/POST/PUT/DELETE等)

            3. 请求URL：完整的端点路径

            4. 请求参数：包括查询参数、路径参数和请求体参数（如有）

            5. 请求示例：完整的请求示例

            6. 响应结构：响应状态码和数据结构

            7. 响应示例：成功的响应示例

            8. 错误代码：可能的错误代码和说明

            9. 使用限制：速率限制、认证要求等


            请使用Markdown格式输出，确保文档结构清晰、内容完整。'
        - role: user
          text: '请为以下API端点生成详细文档：


            {{#5.item#}}'
        retry_config:
