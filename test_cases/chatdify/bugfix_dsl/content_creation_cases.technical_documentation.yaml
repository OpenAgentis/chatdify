    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 分析API描述并生成结构化文档
        model:
          completion_params:
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一位专业的API文档工程师，擅长分析API描述并生成清晰的结构化文档。请根据提供的API描述文本，提取关键信息并生成符合OpenAPI规范的文档结构。输出格式为JSON，包含以下字段：


            1. api_name: API名称

            2. description: API功能描述

            3. endpoint: API端点路径

            4. method: HTTP方法

            5. parameters: 参数列表（包括名称、类型、是否必需、描述）

            6. responses: 响应结构（包括状态码、描述、示例）

            7. examples: 调用示例


            请确保输出格式规范，直接返回JSON内容，不要包含任何解释性文字。'
        - role: user
          text: '请分析以下API描述并生成文档结构：


            {{#2.text#}}'
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        title: API文档生成器
        type: llm
        variables: []
        version: '1'
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 98
      id: '3'
      parentId: null
      position:
        x: 638
        y: 30
      positionAbsolute:
        x: 638
        y: 30
      type: custom
      width: 244
      zIndex: 1
    - data:
        code: "import json\n\ndef extract_json_from_markdown(markdown_text: str) ->\
          \ str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef main(api_doc_text: str)\
          \ -> dict:\n    try:\n        # 预处理输入\n        json_text = extract_json_from_markdown(api_doc_text)\n\
          \        api_data = json.loads(json_text)\n        \n        # 提取关键信息\n\
          \        endpoints = []\n        if isinstance(api_data, list):\n      \
          \      for api in api_data:\n                endpoint = {\n            \
          \        \"api_name\": api.get(\"api_name\", \"\"),\n                  \
          \  \"endpoint\": api.get(\"endpoint\", \"\"),\n                    \"method\"\
          : api.get(\"method\", \"\"),\n                    \"description\": api.get(\"\
          description\", \"\")\n                }\n                endpoints.append(endpoint)\n\
          \        elif isinstance(api_data, dict):\n            endpoint = {\n  \
          \              \"api_name\": api_data.get(\"api_name\", \"\"),\n       \
          \         \"endpoint\": api_data.get(\"endpoint\", \"\"),\n            \
          \    \"method\": api_data.get(\"method\", \"\"),\n                \"description\"\
          : api_data.get(\"description\", \"\")\n            }\n            endpoints.append(endpoint)\n\
          \        \n        return {\n            \"endpoints\": endpoints,\n   \
          \         \"original_data\": api_data,\n            \"error\": None\n  \
          \      }\n    except Exception as e:\n        return {\n            \"endpoints\"\
          : [],\n            \"original_data\": None,\n            \"error\": str(e)\n\
          \        }"
        code_language: python3
        desc: 处理API文档结构并提取关键信息
        outputs:
          endpoints:
            children: null
            type: array[object]
          error:
            children: null
            type: string
          original_data:
            children: null
            type: object
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: API文档处理器
        type: code
        variables:
        - value_selector:
          - '3'
          - text
          variable: api_doc_text
        version: '1'
      height: 90
      id: '4'
      parentId: null
      position:
        x: 942
        y: 30
      positionAbsolute:
        x: 942
        y: 30
      type: custom
      width: 244
      zIndex: 1
