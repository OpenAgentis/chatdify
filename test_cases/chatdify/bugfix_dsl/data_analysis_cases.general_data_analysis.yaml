    - data:
        code: "import json\nimport pandas as pd\nimport plotly.express as px\n\ndef\
          \ extract_json_from_markdown(markdown_text: str) -> str:\n    \"\"\"从markdown提取JSON内容\"\
          \"\"\n    start = markdown_text.find('```json')\n    if start == -1:\n \
          \       start = markdown_text.find('```')\n        if start == -1:\n   \
          \         return markdown_text.strip()\n    \n    start = markdown_text.find('\\\
          n', start) + 1\n    end = markdown_text.rfind('```')\n    return markdown_text[start:end].strip()\n\
          \ndef main(input_data: dict) -> dict:\n    try:\n        # 检查输入数据\n    \
          \    if 'statistics' not in input_data or 'sample_data' not in input_data:\n\
          \            return {\n                \"error\": \"输入数据格式不正确，缺少必要字段\",\n\
          \                \"status\": \"error\",\n                \"visualizations\"\
          : {}\n            }\n            \n        # 获取统计数据和样本数据\n        stats\
          \ = input_data['statistics']\n        sample_data = input_data['sample_data']\n\
          \        \n        # 创建可视化图表\n        visualizations = {}\n        \n  \
          \      # 1. 数值列分布直方图\n        if 'numeric_columns' in stats and stats['numeric_columns']:\n\
          \            for col in stats['numeric_columns']:\n                df =\
          \ pd.DataFrame(sample_data)\n                fig = px.histogram(df, x=col,\
          \ title=f'{col}分布直方图')\n                visualizations[f'{col}_histogram']\
          \ = fig.to_json()\n        \n        # 2. 数值列箱线图\n        if 'numeric_columns'\
          \ in stats and len(stats['numeric_columns']) > 0:\n            df = pd.DataFrame(sample_data)\n\
          \            fig = px.box(df, y=stats['numeric_columns'], title='数值列箱线图')\n\
          \            visualizations['box_plot'] = fig.to_json()\n        \n    \
          \    # 3. 相关性热力图\n        if 'correlation_matrix' in stats and stats['correlation_matrix']:\n\
          \            corr_df = pd.DataFrame(stats['correlation_matrix'])\n     \
          \       if not corr_df.empty:\n                pivot_df = corr_df.pivot(index='Variable1',\
          \ columns='Variable2', values='Correlation')\n                fig = px.imshow(pivot_df,\
          \ text_auto=True, title='变量相关性热力图')\n                visualizations['correlation_heatmap']\
          \ = fig.to_json()\n        \n        # 4. 样本数据表格\n        df = pd.DataFrame(sample_data)\n\
          \        visualizations['sample_table'] = df.to_html()\n        \n     \
          \   return {\n            \"visualizations\": visualizations,\n        \
          \    \"status\": \"success\",\n            \"error\": \"\"\n        }\n\
          \        \n    except Exception as e:\n        return {\n            \"\
          error\": str(e),\n            \"status\": \"error\",\n            \"visualizations\"\
          : {}\n        }"
        code_language: python3
        desc: 生成交互式可视化报表，包括直方图、箱线图、热力图和数据表格
        outputs:
          error:
            children: null
            type: string
          status:
            children: null
            type: string
          visualizations:
            children: null
            type: object
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 可视化报表生成
        type: code
        variables:
        - value_selector:
          - '4'
