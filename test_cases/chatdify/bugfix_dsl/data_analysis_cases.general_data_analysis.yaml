    - data:
        code: "import json\nimport re\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef main(text: str) -> dict:\n\
          \    try:\n        # 预处理输入文本\n        cleaned_text = extract_json_from_markdown(text)\n\
          \        \n        # 数据清洗逻辑\n        # 1. 去除多余空格和换行符\n        cleaned_text\
          \ = ' '.join(cleaned_text.split())\n        \n        # 2. 处理特殊字符\n    \
          \    cleaned_text = cleaned_text.replace('\\ufeff', '')\n        \n    \
          \    # 3. 尝试解析为JSON\n        try:\n            data = json.loads(cleaned_text)\n\
          \            return {\n                \"cleaned_data\": data,\n       \
          \         \"status\": \"success\"\n            }\n        except json.JSONDecodeError:\n\
          \            # 如果不是JSON格式，返回原始文本\n            return {\n               \
          \ \"cleaned_text\": cleaned_text,\n                \"status\": \"success\"\
          \n            }\n    except Exception as e:\n        return {\n        \
          \    \"error\": str(e),\n            \"status\": \"error\"\n        }"
        code_language: python3
