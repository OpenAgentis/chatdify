    - data:
        code: "import json\nimport pandas as pd\nimport numpy as np\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef main(input_data: dict)\
          \ -> dict:\n    try:\n        # 检查输入数据\n        if 'cleaned_data' not in\
          \ input_data:\n            return {\n                \"error\": \"输入数据格式不正确，缺少cleaned_data字段\"\
          ,\n                \"status\": \"error\",\n                \"statistics\"\
          : {},\n                \"sample_data\": []\n            }\n            \n\
          \        # 获取清洗后的数据\n        data = input_data['cleaned_data']\n       \
          \ \n        # 转换为DataFrame进行统计分析\n        df = pd.DataFrame(data)\n    \
          \    \n        # 基础统计分析\n        stats = {\n            \"count\": len(df),\n\
          \            \"numeric_columns\": [col for col in df.columns if pd.api.types.is_numeric_dtype(df[col])],\n\
          \            \"descriptive_stats\": {},\n            \"correlation_matrix\"\
          : {}\n        }\n        \n        # 计算数值列的描述性统计\n        for col in stats['numeric_columns']:\n\
          \            stats['descriptive_stats'][col] = {\n                \"mean\"\
          : float(df[col].mean()),\n                \"median\": float(df[col].median()),\n\
          \                \"std\": float(df[col].std()),\n                \"min\"\
          : float(df[col].min()),\n                \"max\": float(df[col].max()),\n\
          \                \"25%\": float(df[col].quantile(0.25)),\n             \
          \   \"50%\": float(df[col].quantile(0.5)),\n                \"75%\": float(df[col].quantile(0.75))\n\
          \            }\n        \n        # 计算数值列的相关性矩阵\n        if len(stats['numeric_columns'])\
          \ > 1:\n            corr_matrix = df[stats['numeric_columns']].corr()\n\
          \            stats['correlation_matrix'] = corr_matrix.where(np.triu(np.ones(corr_matrix.shape),\
          \ k=1).astype(bool))\n            stats['correlation_matrix'] = stats['correlation_matrix'].stack().reset_index()\n\
          \            stats['correlation_matrix'].columns = ['Variable1', 'Variable2',\
          \ 'Correlation']\n            stats['correlation_matrix'] = stats['correlation_matrix'].to_dict('records')\n\
          \        \n        return {\n            \"statistics\": stats,\n      \
          \      \"sample_data\": df.head(5).to_dict('records'),\n            \"status\"\
          : \"success\",\n            \"error\": \"\"\n        }\n        \n    except\
          \ Exception as e:\n        return {\n            \"error\": str(e),\n  \
          \          \"status\": \"error\",\n            \"statistics\": {},\n   \
          \         \"sample_data\": []\n        }"
        code_language: python3
        desc: 执行基础统计分析，包括描述性统计和相关性分析
        outputs:
          error:
            children: null
            type: string
          sample_data:
            children: null
            type: array[object]
          statistics:
            children: null
            type: object
          status:
            children: null
            type: string
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 基础统计分析
        type: code
