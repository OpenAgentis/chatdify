    - data:
        code: "import json\nimport pandas as pd\nfrom io import StringIO\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef main(input_text: str)\
          \ -> dict:\n    try:\n        # 预处理输入\n        json_text = extract_json_from_markdown(input_text)\n\
          \        \n        # 读取数据为DataFrame\n        df = pd.read_json(StringIO(json_text))\n\
          \        \n        # 执行描述性统计分析\n        numeric_stats = df.describe().to_dict()\n\
          \        \n        # 计算缺失值\n        missing_values = df.isnull().sum().to_dict()\n\
          \        \n        # 计算唯一值数量\n        unique_counts = df.nunique().to_dict()\n\
          \        \n        # 返回统计结果\n        return {\n            \"error\": \"\
          \",\n            \"statistics\": numeric_stats,\n            \"missing_values\"\
          : missing_values,\n            \"unique_counts\": unique_counts,\n     \
          \       \"sample_data\": df.head(5).to_dict(orient='records')\n        }\n\
          \        \n    except Exception as e:\n        return {\n            \"\
          error\": str(e),\n            \"statistics\": {},\n            \"missing_values\"\
          : {},\n            \"unique_counts\": {},\n            \"sample_data\":\
          \ []\n        }"
        code_language: python3
        desc: 执行描述性统计分析，包括基本统计量、缺失值和唯一值计数
        outputs:
          error:
            children: null
            type: string
          missing_values:
            children: null
            type: object
          sample_data:
            children: null
            type: array[object]
          statistics:
            children: null
            type: object
          unique_counts:
            children: null
            type: object
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        timeout: 60
        title: 描述性统计分析
        type: code
        variables:
        - value_selector:
          - '10000002'
          - text
          variable: input_text
        version: '1'
      height: 90
      id: '10000004'
      parentId: null
