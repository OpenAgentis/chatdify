    - data:
        code: "import json\nimport re\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef clean_text(text: str)\
          \ -> str:\n    \"\"\"文本清洗函数\"\"\"\n    # 去除HTML标签\n    text = re.sub(r'<[^>]+>',\
          \ '', text)\n    # 去除特殊字符\n    text = re.sub(r'[\\x00-\\x1f\\x7f-\\x9f]',\
          \ '', text)\n    # 去除多余空格\n    text = ' '.join(text.split())\n    return\
          \ text.strip()\n\ndef main(input_text: str) -> dict:\n    try:\n       \
          \ # 预处理输入\n        json_text = extract_json_from_markdown(input_text)\n\
          \        \n        # 解析JSON数据\n        data = json.loads(json_text)\n  \
          \      \n        # 文本清洗处理\n        if isinstance(data, dict):\n        \
          \    cleaned_data = {k: clean_text(str(v)) if isinstance(v, str) else v\
          \ for k, v in data.items()}\n        elif isinstance(data, list):\n    \
          \        cleaned_data = [clean_text(str(item)) if isinstance(item, str)\
          \ else item for item in data]\n        else:\n            cleaned_data =\
          \ clean_text(str(data))\n        \n        # 返回处理结果\n        return {\n\
          \            \"error\": \"\",\n            \"cleaned_data\": cleaned_data,\n\
          \            \"original_data\": data\n        }\n        \n    except Exception\
          \ as e:\n        return {\n            \"error\": str(e),\n            \"\
          cleaned_data\": None,\n            \"original_data\": None\n        }"
        code_language: python3
        desc: 对提取的文本数据进行预处理和清洗
