        y: -400
      positionAbsolute:
        x: 800
        y: -400
      type: custom
      width: 244
      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 根据分析结果生成可视化图表和解释报告
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一位专业的数据分析师，负责根据提供的数据统计结果和可视化图表生成详细的分析报告。报告需要包含以下内容：


            1. 数据概况：简要描述数据集的基本情况

            2. 统计分析：解读描述性统计结果

            3. 可视化分析：解释图表展示的关键发现

            4. 结论与建议：基于分析结果提出有价值的见解


            报告要求：

            - 使用专业但易懂的语言

            - 重点突出关键发现

            - 保持客观中立

            - 结构清晰，层次分明'
        - role: user
          text: '请根据以下数据生成详细的分析报告：


            <统计数据>

            {{#10000004.statistics#}}

            </统计数据>


            <缺失值统计>

            {{#10000004.missing_values#}}

            </缺失值统计>


            <唯一值统计>

            {{#10000004.unique_counts#}}

            </唯一值统计>'
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        title: 数据分析报告
        type: llm
        variables:
        - value_selector:
          - '10000004'
          - statistics
          variable: statistics
        - value_selector:
          - '10000004'
          - missing_values
          variable: missing_values
        - value_selector:
          - '10000004'
          - unique_counts
          variable: unique_counts
        version: '1'
        vision:
          enabled: false
      height: 90
      id: '10000005'
      parentId: null
      position:
        x: 1400
        y: -400
      positionAbsolute:
        x: 1400
        y: -400
      type: custom
      width: 244
