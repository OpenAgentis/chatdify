            1. 准确性：[评分1-5分] [评语]

            2. 流畅性：[评分1-5分] [评语]

            3. 术语一致性：[评分1-5分] [评语]

            4. 风格匹配：[评分1-5分] [评语]


            评分标准：

            5分：完美

