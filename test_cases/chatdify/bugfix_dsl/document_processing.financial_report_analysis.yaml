    - data:
        code: "import json\nimport re\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef format_final_report(report_text:\
          \ str) -> dict:\n    \"\"\"格式化最终报告输出\"\"\"\n    try:\n        # 预处理输入\n\
          \        json_text = extract_json_from_markdown(report_text)\n        report_data\
          \ = json.loads(json_text)\n        \n        # 提取关键信息\n        analysis_summary\
          \ = report_data.get('analysis_summary', '')\n        financial_ratios =\
          \ report_data.get('financial_ratios', {})\n        trend_analysis = report_data.get('trend_analysis',\
          \ {})\n        visualization_suggestions = report_data.get('visualization_suggestions',\
          \ [])\n        \n        # 构建格式化输出\n        formatted_output = {\n     \
          \       'summary': analysis_summary,\n            'key_metrics': {\n   \
          \             'current_ratio': financial_ratios.get('current_ratio', None),\n\
          \                'debt_to_assets': financial_ratios.get('debt_to_assets',\
          \ None),\n                'net_profit_margin': financial_ratios.get('net_profit_margin',\
          \ None)\n            },\n            'trends': {\n                'yoy_growth':\
          \ trend_analysis.get('yoy_growth', None),\n                'mom_growth':\
          \ trend_analysis.get('mom_growth', None)\n            },\n            'visualizations':\
          \ visualization_suggestions,\n            'raw_data': report_data,\n   \
          \         'error': None\n        }\n        \n        return formatted_output\n\
          \    except Exception as e:\n        return {\n            'summary': None,\n\
          \            'key_metrics': None,\n            'trends': None,\n       \
          \     'visualizations': None,\n            'raw_data': report_text,\n  \
          \          'error': str(e)\n        }\n\ndef main(text: str) -> dict:\n\
          \    \"\"\"主函数入口\"\"\"\n    return format_final_report(text)"
        code_language: python3
        desc: 格式化最终报告输出，提取关键信息并构建结构化响应
