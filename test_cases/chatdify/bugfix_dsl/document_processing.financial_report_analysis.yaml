    - data:
        code: "import re\nimport json\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef identify_financial_statements(text:\
          \ str) -> dict:\n    \"\"\"识别财务报表类型\"\"\"\n    balance_sheet_keywords =\
          \ ['资产', '负债', '所有者权益', '资产负债表']\n    income_statement_keywords = ['收入',\
          \ '利润', '费用', '利润表']\n    cash_flow_keywords = ['现金', '流量', '现金流量表']\n \
          \   \n    result = {\n        'balance_sheet': False,\n        'income_statement':\
          \ False,\n        'cash_flow': False,\n        'content': text,\n      \
          \  'error': None\n    }\n    \n    try:\n        for keyword in balance_sheet_keywords:\n\
          \            if keyword in text:\n                result['balance_sheet']\
          \ = True\n                break\n        \n        for keyword in income_statement_keywords:\n\
          \            if keyword in text:\n                result['income_statement']\
          \ = True\n                break\n        \n        for keyword in cash_flow_keywords:\n\
          \            if keyword in text:\n                result['cash_flow'] =\
          \ True\n                break\n    except Exception as e:\n        result['error']\
          \ = str(e)\n    \n    return result\n\ndef main(text: str) -> dict:\n  \
          \  try:\n        # 预处理输入\n        json_text = extract_json_from_markdown(text)\n\
          \        \n        # 识别财务报表类型\n        result = identify_financial_statements(json_text)\n\
          \        \n        return {\n            'result': result,\n           \
          \ 'error': None\n        }\n    except Exception as e:\n        return {\n\
          \            'result': {\n                'balance_sheet': False,\n    \
          \            'income_statement': False,\n                'cash_flow': False,\n\
          \                'content': text,\n                'error': str(e)\n   \
          \         },\n            'error': str(e)\n        }"
        code_language: python3
        desc: 处理文本数据并识别资产负债表、利润表和现金流量表
        outputs:
          error:
            children: null
            type: string
          result:
            children: null
            type: object
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 财务报表识别
        type: code
        variables:
        - value_selector:
          - '10000002'
