    - data:
        code: "import json\nfrom datetime import datetime, timedelta\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef calculate_yoy_mom(data:\
          \ dict, current_period: str) -> dict:\n    \"\"\"计算同比和环比增长率\"\"\"\n    try:\n\
          \        # 解析当前日期\n        current_date = datetime.strptime(current_period,\
          \ '%Y-%m-%d')\n        \n        # 计算同比日期(去年同月)\n        yoy_date = (current_date\
          \ - timedelta(days=365)).strftime('%Y-%m-%d')\n        \n        # 计算环比日期(上月)\n\
          \        mom_date = (current_date - timedelta(days=30)).strftime('%Y-%m-%d')\n\
          \        \n        # 获取各期数据\n        current_value = data.get(current_period,\
          \ 0)\n        yoy_value = data.get(yoy_date, 0)\n        mom_value = data.get(mom_date,\
          \ 0)\n        \n        # 计算增长率\n        yoy_growth = ((current_value -\
          \ yoy_value) / yoy_value * 100) if yoy_value != 0 else 0\n        mom_growth\
          \ = ((current_value - mom_value) / mom_value * 100) if mom_value != 0 else\
          \ 0\n        \n        return {\n            'current_period': current_period,\n\
          \            'current_value': current_value,\n            'yoy_period':\
          \ yoy_date,\n            'yoy_value': yoy_value,\n            'yoy_growth':\
          \ round(yoy_growth, 2),\n            'mom_period': mom_date,\n         \
          \   'mom_value': mom_value,\n            'mom_growth': round(mom_growth,\
          \ 2),\n            'error': None\n        }\n    except Exception as e:\n\
          \        return {\n            'current_period': current_period,\n     \
          \       'current_value': current_value,\n            'yoy_period': None,\n\
          \            'yoy_value': None,\n            'yoy_growth': None,\n     \
          \       'mom_period': None,\n            'mom_value': None,\n          \
          \  'mom_growth': None,\n            'error': str(e)\n        }\n\ndef main(input_data:\
          \ dict) -> dict:\n    try:\n        # 预处理输入\n        if 'financial_ratios'\
          \ not in input_data or 'raw_data' not in input_data['financial_ratios']:\n\
          \            raise ValueError(\"输入数据格式不正确，缺少财务指标数据\")\n            \n  \
          \      financial_data = input_data['financial_ratios']['raw_data']\n   \
          \     \n        # 获取当前日期(假设数据中最新日期为当前日期)\n        dates = sorted(financial_data.keys())\n\
          \        if not dates:\n            raise ValueError(\"财务数据中没有有效的日期数据\"\
          )\n        current_period = dates[-1]\n        \n        # 计算同比环比\n    \
          \    analysis_result = {}\n        \n        # 对每个财务指标计算同比环比\n        for\
          \ metric in ['operating_revenue', 'net_profit', 'total_assets']:\n     \
          \       if metric in financial_data[current_period]:\n                metric_data\
          \ = {date: financial_data[date][metric] for date in dates if metric in financial_data[date]}\n\
          \                analysis_result[metric] = calculate_yoy_mom(metric_data,\
          \ current_period)\n        \n        return {\n            'analysis_result':\
          \ analysis_result,\n            'financial_ratios': input_data['financial_ratios'],\n\
          \            'error': None\n        }\n    except Exception as e:\n    \
          \    return {\n            'analysis_result': None,\n            'financial_ratios':\
          \ input_data['financial_ratios'] if 'financial_ratios' in input_data else\
          \ None,\n            'error': str(e)\n        }"
        code_language: python3
        desc: 计算财务数据的同比和环比增长率
        outputs:
          analysis_result:
            children: null
            type: object
          error:
            children: null
            type: string
          financial_ratios:
            children: null
            type: object
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        selected: false
        timeout: 60
        title: 同比环比分析
        type: code
