      zIndex: 0
    - data:
        code: "import json\n\ndef extract_json_from_markdown(markdown_text: str) ->\
          \ str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef calculate_financial_ratios(financial_data:\
          \ dict) -> dict:\n    \"\"\"计算关键财务指标\"\"\"\n    try:\n        # 流动比率 = 流动资产\
          \ / 流动负债\n        current_ratio = financial_data['current_assets'] / financial_data['current_liabilities']\n\
          \        \n        # 资产负债率 = 总负债 / 总资产\n        debt_to_assets = financial_data['total_liabilities']\
          \ / financial_data['total_assets']\n        \n        # 净利润率 = 净利润 / 营业收入\n\
          \        net_profit_margin = financial_data['net_profit'] / financial_data['operating_revenue']\n\
          \        \n        return {\n            'current_ratio': round(current_ratio,\
          \ 4),\n            'debt_to_assets': round(debt_to_assets, 4),\n       \
          \     'net_profit_margin': round(net_profit_margin, 4),\n            'raw_data':\
          \ financial_data,\n            'error': None\n        }\n    except Exception\
          \ as e:\n        return {\n            'current_ratio': None,\n        \
          \    'debt_to_assets': None,\n            'net_profit_margin': None,\n \
          \           'raw_data': financial_data,\n            'error': str(e)\n \
          \       }\n\ndef main(input_data: dict) -> dict:\n    try:\n        # 预处理输入\n\
          \        if 'result' not in input_data or 'content' not in input_data['result']:\n\
          \            raise ValueError(\"输入数据格式不正确，缺少必要字段\")\n            \n    \
          \    financial_data = json.loads(input_data['result']['content'])\n    \
          \    \n        # 计算财务指标\n        ratios = calculate_financial_ratios(financial_data)\n\
          \        \n        return {\n            'financial_ratios': ratios,\n \
          \           'raw_data': financial_data,\n            'error': None\n   \
          \     }\n    except Exception as e:\n        return {\n            'financial_ratios':\
          \ {\n                'current_ratio': None,\n                'debt_to_assets':\
          \ None,\n                'net_profit_margin': None,\n                'raw_data':\
          \ input_data,\n                'error': str(e)\n            },\n       \
          \     'raw_data': input_data,\n            'error': str(e)\n        }"
        code_language: python3
        desc: 计算关键财务指标（流动比率、资产负债率、净利润率等）
