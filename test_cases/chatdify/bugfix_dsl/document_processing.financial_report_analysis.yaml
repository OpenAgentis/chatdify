            1. 分析财务指标趋势：包括营业收入、净利润、总资产等关键指标的同比和环比变化

            2. 评估财务健康状况：分析流动比率、资产负债率、净利润率等关键财务比率

            3. 识别关键发现：指出数据中最重要的趋势和异常点

            4. 提供可视化建议：推荐最适合展示这些数据的图表类型和格式


            报告格式要求：

            - 使用Markdown格式

            - 包含清晰的标题和分段

            - 重要数据点使用加粗强调

            - 图表建议需包含图表类型和理由说明'
        - role: user
          text: '请基于以下财务数据生成分析报告和可视化建议：


            财务指标数据：

            {{#10000005.financial_ratios#}}


