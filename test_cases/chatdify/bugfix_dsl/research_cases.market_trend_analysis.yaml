    - data:
        code: "import json\nfrom typing import Dict, Any\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef main(analysis_result:\
          \ str) -> Dict[str, Any]:\n    \"\"\"\n    处理市场分析结果并生成可视化建议\n    \n    参数:\n\
          \        analysis_result: 市场趋势分析结果(Markdown格式)\n    \n    返回:\n        Dict[str,\
          \ Any]: 包含可视化建议的数据\n    \"\"\"\n    try:\n        # 提取JSON数据\n        json_text\
          \ = extract_json_from_markdown(analysis_result)\n        data = json.loads(json_text)\
          \ if json_text else {}\n        \n        # 生成可视化建议\n        result = {\n\
          \            'chart_types': ['line', 'bar', 'pie'],\n            'metrics':\
          \ ['trend_1', 'trend_2', 'trend_3'],\n            'time_periods': ['Q1',\
          \ 'Q2', 'Q3', 'Q4'],\n            'status': 'success',\n            'error':\
          \ None\n        }\n        \n        return result\n        \n    except\
          \ Exception as e:\n        return {\n            'chart_types': [],\n  \
          \          'metrics': [],\n            'time_periods': [],\n           \
          \ 'status': 'failed',\n            'error': str(e)\n        }"
