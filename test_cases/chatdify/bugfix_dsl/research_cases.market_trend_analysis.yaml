    - data:
        code: "import json\nimport pandas as pd\nfrom typing import Dict, Any\n\n\
          def extract_json_from_markdown(markdown_text: str) -> str:\n    \"\"\"从markdown提取JSON内容\"\
          \"\"\n    start = markdown_text.find('```json')\n    if start == -1:\n \
          \       start = markdown_text.find('```')\n        if start == -1:\n   \
          \         return markdown_text.strip()\n    \n    start = markdown_text.find('\\\
          n', start) + 1\n    end = markdown_text.rfind('```')\n    return markdown_text[start:end].strip()\n\
          \ndef main(market_data: str) -> Dict[str, Any]:\n    \"\"\"\n    市场数据预处理和分析\n\
          \    \n    参数:\n        market_data: 从Tavily搜索获取的市场数据\n    \n    返回:\n \
          \       Dict[str, Any]: 包含清洗后的数据和基本统计信息\n    \"\"\"\n    try:\n        #\
          \ 预处理输入数据\n        json_text = extract_json_from_markdown(market_data)\n\
          \        data = json.loads(json_text)\n        \n        # 转换为DataFrame进行清洗\n\
          \        df = pd.DataFrame(data)\n        \n        # 数据清洗\n        df =\
          \ df.dropna()  # 删除缺失值\n        df = df.drop_duplicates()  # 删除重复值\n   \
          \     \n        # 计算基本统计信息\n        stats = {\n            'count': len(df),\n\
          \            'columns': list(df.columns),\n            'numeric_stats':\
          \ df.describe().to_dict() if len(df.select_dtypes(include=['number']).columns)\
          \ > 0 else {}\n        }\n        \n        return {\n            'cleaned_data':\
          \ df.to_dict('records'),\n            'statistics': stats,\n           \
          \ 'status': 'success',\n            'error': None\n        }\n        \n\
          \    except Exception as e:\n        return {\n            'cleaned_data':\
          \ None,\n            'statistics': None,\n            'status': 'failed',\n\
          \            'error': str(e)\n        }"
        code_language: python3
        desc: 对收集到的市场数据进行预处理和清洗，输出清洗后的数据和基本统计信息
        outputs:
          cleaned_data:
            children: null
            type: array[object]
          error:
            children: null
            type: string
          statistics:
            children: null
            type: object
          status:
            children: null
            type: string
        retry_config:
