      zIndex: 0
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 根据数据分析结果生成可视化图表和说明
        model:
          completion_params:
            max_tokens: 2000
            temperature: 0.2
            top_p: 0.6
          mode: chat
          name: deepseek-v3-250324
          provider: langgenius/volcengine_maas/volcengine_maas
        prompt_template:
        - role: system
          text: '你是一位数据分析可视化专家，擅长根据数据分析结果生成清晰的可视化图表和解释说明。请根据提供的数据分析结果，生成最适合的可视化图表代码（如ECharts、Matplotlib等）以及详细的图表说明。


            图表生成要求：

            1. 根据数据分析结果选择最合适的可视化方式

            2. 图表代码要完整可执行

            3. 图表说明要清晰解释图表展示的数据关系和洞察

            4. 使用Markdown格式输出'
        - role: user
          text: '请根据以下数据分析结果生成可视化图表和说明：


            数据分析结果：

            {{#10000003.analysis_result#}}'
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 1000
        timeout: 120
        title: 可视化图表生成
        type: llm
        variables:
        - value_selector:
          - '10000003'
          - analysis_result
          variable: analysis_result
        version: '1'
        vision:
          enabled: false
      height: 90
      id: '10000004'
      parentId: null
      position:
        x: 1100
        y: -533.8248412275507
      positionAbsolute:
        x: 1100
        y: -533.8248412275507
      type: custom
      width: 244
      zIndex: 0
    - data:
        desc: 展示最终的可视化结果
        output_type: object
        outputs:
        - value_selector:
          - '10000004'
          - text
          variable: visualization_result
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        title: 可视化结果展示
        type: end
        version: '1'
      height: 90
      id: '10000005'
      parentId: null
