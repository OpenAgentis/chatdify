    - data:
        code: "import json\nimport pandas as pd\nfrom io import StringIO\n\ndef extract_json_from_markdown(markdown_text:\
          \ str) -> str:\n    \"\"\"从markdown提取JSON内容\"\"\"\n    start = markdown_text.find('```json')\n\
          \    if start == -1:\n        start = markdown_text.find('```')\n      \
          \  if start == -1:\n            return markdown_text.strip()\n    \n   \
          \ start = markdown_text.find('\\n', start) + 1\n    end = markdown_text.rfind('```')\n\
          \    return markdown_text[start:end].strip()\n\ndef analyze_data_structure(data:\
          \ dict) -> dict:\n    \"\"\"分析数据结构并推荐图表类型\"\"\"\n    try:\n        # 尝试将数据转换为DataFrame\n\
          \        df = pd.read_json(StringIO(json.dumps(data)))\n        \n     \
          \   # 分析数据类型\n        numeric_cols = df.select_dtypes(include=['number']).columns.tolist()\n\
          \        categorical_cols = df.select_dtypes(include=['object', 'category']).columns.tolist()\n\
          \        \n        # 根据数据类型推荐图表\n        chart_recommendations = []\n  \
          \      \n        if len(numeric_cols) >= 1 and len(categorical_cols) >=\
          \ 1:\n            # 数值+分类数据\n            chart_recommendations.extend([\n\
          \                'bar', 'box', 'violin', 'strip'\n            ])\n     \
          \   \n        if len(numeric_cols) >= 2:\n            # 多个数值列\n        \
          \    chart_recommendations.extend([\n                'scatter', 'line',\
          \ 'heatmap', 'pairplot'\n            ])\n        \n        if len(categorical_cols)\
          \ >= 1:\n            # 分类数据\n            chart_recommendations.extend([\n\
          \                'pie', 'countplot', 'histogram'\n            ])\n     \
          \   \n        if len(numeric_cols) == 1:\n            # 单数值列\n         \
          \   chart_recommendations.extend([\n                'histogram', 'kde',\
          \ 'boxplot'\n            ])\n        \n        return {\n            'data_structure':\
          \ {\n                'numeric_columns': numeric_cols,\n                'categorical_columns':\
          \ categorical_cols,\n                'row_count': len(df),\n           \
          \     'column_count': len(df.columns)\n            },\n            'chart_recommendations':\
          \ list(set(chart_recommendations))\n        }\n    \n    except Exception\
          \ as e:\n        return {\n            'data_structure': None,\n       \
          \     'chart_recommendations': [],\n            'error': str(e)\n      \
          \  }\n\ndef main(text: str) -> dict:\n    try:\n        # 预处理输入\n      \
          \  json_text = extract_json_from_markdown(text)\n        data = json.loads(json_text)\n\
          \        \n        # 分析数据结构\n        analysis_result = analyze_data_structure(data)\n\
          \        \n        return {\n            'analysis_result': analysis_result,\n\
          \            'status': 'success'\n        }\n    \n    except Exception\
          \ as e:\n        return {\n            'analysis_result': {\n          \
          \      'data_structure': None,\n                'chart_recommendations':\
          \ [],\n                'error': str(e)\n            },\n            'status':\
          \ 'error'\n        }"
        code_language: python3
        desc: 分析输入数据的结构和类型，推荐合适的图表类型
        outputs:
          analysis_result:
            children: null
            type: object
          status:
            children: null
            type: string
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 0
        timeout: 60
        title: 数据分析与图表推荐
        type: code
        variables:
        - value_selector:
          - '10000002'
          - text
          variable: text
        version: '1'
      height: 90
