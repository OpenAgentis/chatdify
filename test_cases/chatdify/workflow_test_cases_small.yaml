# 内容创作类工作流
content_creation_cases:
  ppt_generation:
    prompt: |
      生成一个产品介绍PPT工作流，产品名称由用户输入。
      要求：
      1. 自动搜集产品信息
      2. 生成PPT大纲
      3. 为每页PPT生成内容
      4. 输出markdown格式

  marketing_copy:
    prompt: |
      生成一个营销文案工作流，根据用户指定的产品信息和平台（小红书，微博，抖音，视频号，快手）生成符合要求的营销文案。
      要求：
      1. 营销文案要求复合平台特性
      2. 生成多个文案版本

  video_script:
    prompt: |
      生成一个视频脚本工作流，根据主题生成短视频脚本（不需要生成视频，只需要生成视频脚本）。
      要求：
      1. 生成视频大纲
      2. 编写分镜脚本
      3. 设计画面说明
      4. 配音文案生成

  audio_script:
    prompt: |
      音频生成工作流，根据主题生成音频脚本（不需要生成音频，只需要生成音频脚本）。
      要求：
      1. 生成音频大纲
      2. 生成音频脚本
    
# 数据分析类工作流
data_analysis_cases:
  general_data_analysis:
    prompt: |
      生成一个数据分析工作流，支持上传文件，且可以通过提问来进行文档分析以及生成报表等。
      要求：
      1. 支持Excel、CSV格式
      2. 支持数据清洗和预处理
      3. 支持基础统计分析
      4. 生成可视化报表
    input_file: stock.xlsx

  data_visualization:
    prompt: |
      生成一个数据可视化工作流。
      核心功能：根据用户上传的文件（excel，csv），通过大模型解析内容，输出为标准JSON格式，
      最后使用echarts生成可视化页面，支持多种图表类型。
    input_file: stock.xlsx

  stock_data_analysis:
    prompt: |
      生成一个股票数据分析工作流，通过API获取股票数据，进行技术分析并生成分析报告。
      要求：
      1. 支持获取历史K线数据
      2. 计算技术指标
      3. 生成趋势分析
      4. 输出可视化图表
      
# 文档处理类工作流
doc_workflow_cases:
  translate_workflow_v1:
    prompt: |
      帮我生成一个翻译工作流。
      核心功能是通过大模型将用户内容翻译成目标语言。
      用户有两个输入：一个是输入是用户的原始内容，另一个输入是目标语言。
      有两个大模型，一个翻译大模型（负责翻译），一个质检大模型（负责对翻译的质量打分）。
      质检大模型的评分细则：
        ## 从下面四个维度评分：                  
           1）准确性（Accuracy）：译文是否正确传达了原文的含义，是否存在歪曲或错译等情况；
           2）流畅性（Fluency）：译文在英语层面的语法、表达是否通顺自然，是否符合英语使用习惯；
          3）完整性（Completeness）：译文中是否缺少原文的重要信息，是否有明显的增译或删减；
          4）风格与用词（Style & Word Choice）：译文的用词、措辞及整体风格是否符合原文意图，是否与语境、专业领域或目标读者相匹配。
       在对以上每个维度进行 1-5 分的打分后，请给出一个"综合评分"并说明理由。综合评分是这4个维度分数总和。
       最终输出结果应该是一个JSON格式，包含以下字段：
          1）原始内容；
          2）目标语言；
          3）翻译结果；
          4）综合评分；
          5）评分理由；

  translate_workflow_v2:
    prompt: |
       帮我生成一个高质量的翻译工作流，实现以下功能：
       ## 输入参数
        1. 原始内容：用户需要翻译的文本内容
        2. 目标语言：期望翻译的目标语言

        ## 工作流程
        1. 语言检测：
          - 检测原始内容的语言类型
          - 如果原始内容语言与目标语言相同，直接返回原始内容
        
        2. 内容翻译：
          - 使用翻译大模型进行翻译
          - 保持原文的格式和结构
          - 专业术语需保持准确性
        
        3. 质量评估：
          使用质检大模型对翻译结果进行多维度评分（1-5分）：
          - 准确性：原文含义的准确传达
          - 流畅性：目标语言的自然度和语法正确性
          - 完整性：信息的完整保留
          - 专业性：术语使用的准确性和一致性
        
        ## 输出格式
        JSON格式，包含以下字段：
        {
          "source_content": "原始内容",
          "source_language": "源语言",
          "target_language": "目标语言",
          "translation": "翻译结果",
          "quality_scores": {
            "accuracy": "准确性得分",
            "fluency": "流畅性得分",
            "completeness": "完整性得分",
            "professionalism": "专业性得分",
            "total_score": "总分",
            "comments": "评分理由"
          }
        }

  meeting_minutes_process:
    input_file: meeting_note.txt
    prompt: |
      生成会议纪要处理的工作流，能处理会议文本，得到章节、会议总结，行动项等信息。
      要求：
      1. 提取关键议题
      2. 生成会议总结
      3. 生成会议行动项

  doc_qa_system:
    prompt: |
      生成一个文档智能问答工作流，支持用户上传 PDF、Word 等格式的文档，并基于文档全文回答用户提出的问题。
      要求：
      要求：
      1. 用户输入：一份待查阅的文档，以及一个关于该文档的问题（场景默认是关于 "deepseek-r1" 的技术问题）
      2. 自动解析上传的文档，提取其中的文字内容
      3. 结合文档全文与用户问题生成答案
      4. 最终输出：针对该问题的回答正文
    input_file: deepseek-r1.pdf

# 研究报告类工作流
research_cases:
  deep_research_report_v1:
    prompt: |
      生成一个deep research工作流。
      核心功能：根据用户输入主题内容，通过搜索引擎检索相关内容，对检索内容进行分析整理，
      最后生成完整的研究报告。要求报告结构完整，包含数据支撑。

  deep_research_report_v2:
    prompt: |
      帮我生成一个专业的研究分析师工作流，请根据以下要求生成深度研究报告：

      ## 输入参数
      1. 研究主题：用户需要深入研究的主题内容
      2. 研究范围：可选，限定研究的具体领域或时间范围

      ## 工作流程
      1. 主题分析：
        - 分析用户提供的研究主题
        - 提取核心关键词
        - 确定研究维度和方向

      2. 资料收集：
        - 对每个关键词使用搜索引擎检索相关内容
        - 确保信息来源的权威性和时效性
        - 保存重要的参考资料和数据

      3. 内容分析：
        - 对收集的资料进行系统性分析
        - 提取关键信息和数据
        - 识别主要趋势和模式

      4. 报告生成：
        - 按照结构化格式组织内容
        - 确保论据充分，数据准确
        - 生成专业的研究报告

      ## 输出格式
      以MarkDown 格式输出深度研究报告。

  competitor_analysis:
    prompt: |
      生成一个竞品分析工作流，输入目标产品和竞品名称，自动生成竞品分析报告。
      要求：
      1. 搜索产品相关信息
      2. 对比核心功能特性
      3. 分析优劣势
      4. 生成市场策略建议

  industry_research:
    prompt: |
      生成一个行业研究工作流，输入行业名称，自动生成行业研究报告。
      要求：
      1. 行业概况分析
      2. 市场规模数据
      3. 竞争格局分析
      4. 发展趋势预测

  hot_news:
    prompt: |
      生成一个百度热搜新闻抓取工作流，根据用户指定的数量返回当前的实时热搜，并附带每条新闻的详情摘要。
      要求：
      1. 用户输入希望获取的热搜数量（如 10、20、50，范围 1-50）
      2. 抓取百度热搜实时榜单页面（https://top.baidu.com/board?tab=realtime）的内容
      3. 从榜单中解析出热搜列表（标题、热搜指数、简介、详情链接），并按用户指定的数量截取
      4. 对截取后的每条热搜，进一步抓取其详情页，整理为：标题、来源、发布时间、正文摘要
      5. 最终输出一个结构化的热搜新闻列表（JSON 数组）

